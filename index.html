let ADDR_IDX = null;
const normCalle = t => norm(t).replace(/^(avenida|av|avda|calle|pasaje|pje|boulevard|bv)\s+/, "").replace(/\s+(norte|sur)$/, m => m).trim();
function addrIdx(){
  if(ADDR_IDX) return ADDR_IDX;
  const map = new Map();
  Object.entries(ADDR).forEach(([n, s]) => { map.set(n, s.split(",").map(p => p.split(" ").map(Number))); });
  const nombres = new Set(Object.keys(ADDR));
  azData().ways.forEach(w => { if(w.n && w.c <= 4) nombres.add(w.n); });
  ADDR_IDX = {pts:map, nombres:[...nombres].map(n => ({n, k:normCalle(n)}))};
  return ADDR_IDX;
}
function calleMatch(txt){
  const k = normCalle(txt);
  if(k.length < 2) return [];
  const all = addrIdx().nombres;
  const exact = all.filter(c => c.k === k);
  if(exact.length) return exact.map(c => c.n).sort((a, b) => (ADDR[b] ? 1 : 0) - (ADDR[a] ? 1 : 0));
  const pre = all.filter(c => c.k.startsWith(k) || c.k.split(" ").some(w => w.startsWith(k) && k.length >= 4));
  if(pre.length) return pre.map(c => c.n);
  return all.filter(c => c.k.includes(k)).map(c => c.n);
}
/* Ubica «calle número»: interpola entre las alturas conocidas */
function ubicarAltura(calle, num){
  const pts = addrIdx().pts.get(calle);
  if(pts && pts.length){
    let lo = null, hi = null;
    pts.forEach(p => { if(p[0] <= num && (!lo || p[0] > lo[0])) lo = p; if(p[0] >= num && (!hi || p[0] < hi[0])) hi = p; });
    if(lo && hi){
      if(hi[0] === lo[0]) return {x:lo[1], y:lo[2], q:"exacta"};
      const t = (num - lo[0]) / (hi[0] - lo[0]);
      const gap = hi[0] - lo[0];
      return {x:lo[1] + (hi[1] - lo[1]) * t, y:lo[2] + (hi[2] - lo[2]) * t, q:gap <= 120 ? "exacta" : "aproximada"};
    }
    const near = lo || hi;
    if(Math.abs(near[0] - num) <= 150) return {x:near[1], y:near[2], q:"aproximada"};
  }
  return null;
}
function cruce(a, b){
  const az = azData(), A = az.ways.filter(w => w.n === a), B = az.ways.filter(w => w.n === b);
  const pa = new Set(); A.forEach(w => w.pts.forEach(p => pa.add(p[0] + "," + p[1])));
  for(const w of B) for(const p of w.pts) if(pa.has(p[0] + "," + p[1])) return p;
  let best = null, bd = 1e18;
  A.forEach(w => w.pts.forEach(p => B.forEach(v => v.pts.forEach(q => { const d = ((p[0] - q[0]) * KX) ** 2 + ((p[1] - q[1]) * KY) ** 2; if(d < bd){ bd = d; best = [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2]; } }))));
  return bd < 80 * 80 ? best : null;
}
/* Entrada libre: «Belgrano 750», «Av. Mitre 1020», «Colón 830 entre Burgos y Necochea» */
function ubicarDireccion(txt, entre){
  const t = String(txt || "").trim();
  const m = t.match(/^(.*?)[\s,]+(?:n[°ºo.]*\s*)?(\d{1,5})\s*$/i);
  const calleTxt = m ? m[1] : t, num = m ? parseInt(m[2], 10) : null;
  const cands = calleMatch(calleTxt);
  if(!cands.length) return {err:`No encontré la calle «${calleTxt}» en Azul. Revisa cómo se escribe o busca una esquina.`};
  const calle = cands[0];
  if(num){
    const r = ubicarAltura(calle, num);
    if(r) return Object.assign(r, {calle, num, otras:cands.slice(1, 4)});
  }
  if(entre){
    const [e1, e2] = String(entre).split(/\s+y\s+|,/).map(s => s.trim()).filter(Boolean);
    const c1 = e1 && calleMatch(e1)[0], c2 = e2 && calleMatch(e2)[0];
    const p1 = c1 && cruce(calle, c1), p2 = c2 && cruce(calle, c2);
    if(p1 && p2) return {x:(p1[0] + p2[0]) / 2, y:(p1[1] + p2[1]) / 2, q:"aproximada", calle, num};
    if(p1 || p2){ const p = p1 || p2; return {x:p[0], y:p[1], q:"aproximada", calle, num}; }
  }
  const ws = azData().ways.filter(w => w.n === calle).flatMap(w => w.pts);
  if(ws.length){ const mid = ws[Math.floor(ws.length / 2)]; return {x:mid[0], y:mid[1], q:"calle", calle, num}; }
  return {err:`No tengo la altura de «${calle}». Agrega entre qué calles está o toca el lugar en el mapa.`};
}

function getAyudaGeo(){

  a.buscando = true; say("Buscando tu ubicación con el GPS… Si estás bajo techo, acércate a una ventana.");

const toB64u = bytes => { let bin = ""; bytes.forEach(b => { bin += String.fromCharCode(b); }); return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };

const QR_CHUNK = 600;

  const id = Math.random().toString(36).slice(2, 6) || "x";
  const n = Math.max(1, Math.ceil(code.length / QR_CHUNK));
  return Array.from({length:n}, (_, k) => `PREP1|${id}|${k + 1}|${n}|${code.slice(k * QR_CHUNK, (k + 1) * QR_CHUNK)}`);

function addPart(raw){
  const m = /^PREP1\|([a-z0-9]+)\|(\d+)\|(\d+)\|([A-Za-z0-9_-]+)$/.exec(String(raw).trim());
  if(!m || +m[2] < 1 || +m[2] > +m[3]) return null;
  const n = +m[3];
  if(ui.share.got.id !== m[1]) ui.share.got = {id:m[1], n, parts:{}};
  ui.share.got.parts[m[2]] = m[4];
  const have = Object.keys(ui.share.got.parts).length;
  return {have, n, code:have >= n ? Array.from({length:n}, (_, k) => ui.share.got.parts[k + 1]).join("") : null};
}

  if(!parts.length) return decodeCode(t);
  let r = null;
  parts.forEach(p => { const x = addPart(p); if(x) r = x; });
  if(!r) throw new Error("formato");
  if(!r.code){ const e = new Error("faltan"); e.falta = r.n - r.have; e.n = r.n; throw e; }
  ui.share.got = {};

async function sendFile(){

  if(!SHARE.some(s => ui.share.sel[s.id] && s.has())){ say("Elige qué compartir: todavía no hay datos en lo que marcaste."); return; }
  const text = JSON.stringify(sharePayload());

  try{
    const file = new File([text], name, {type:"text/plain"});

  if(r === "saved") say("El archivo quedó en Descargas. Ábrelo en la app Archivos, tócalo sin soltar y elige Compartir → Quick Share.");

/* Guardar un archivo: dentro de Claude pide permiso con «downloads»; fuera, usa una descarga común. */
async function saveFile(name, text){
  try{
    if(window.claude && typeof window.claude.use === "function"){
      const dl = await window.claude.use("downloads");
      if(dl){
        try{ await dl.save({filename:name, data:text}); return "saved"; }
        catch(e){ const c = e && e.code; if(c === "declined") return "declined"; if(c === "rate_limited") return "busy"; }
      }
    }
  }catch(e){}
  try{
    const url = URL.createObjectURL(new Blob([text], {type:/\.html$/.test(name) ? "text/html" : "text/plain"}));
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    return "saved";
  }catch(e){ return "fail"; }
}

let scanStream = null, scanTimer = null;
async function startScan(){
  const st = m => { const el = document.getElementById("scan-st"); if(el) el.textContent = m; };
  const fail = m => { stopScan(); ui.share.rmsg = m; render(false); };
  let ok = "BarcodeDetector" in window && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  try{ if(ok && BarcodeDetector.getSupportedFormats) ok = (await BarcodeDetector.getSupportedFormats()).includes("qr_code"); }catch(e){ ok = false; }
  if(!ok){ fail("Este navegador no puede leer códigos QR. Usa «Abrir archivo» o «Pegar código»."); return; }
  ui.share.scanning = true; ui.share.rmsg = "";
  render(false);
  try{
    const det = new BarcodeDetector({formats:["qr_code"]});
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}, audio:false});
    const v = document.getElementById("scan-video");
    if(!ui.share.scanning || !v){ stream.getTracks().forEach(t => t.stop()); ui.share.scanning = false; return; }
    scanStream = stream;
    v.srcObject = stream;
    await v.play();
    const tick = async () => {
      if(!ui.share.scanning) return;
      try{
        const codes = v.readyState >= 2 ? await det.detect(v) : [];
        for(const c of codes){
          const r = addPart(c.rawValue || "");
          if(!r) continue;
          if(r.code){ stopScan(); ui.share.got = {}; receiveText(r.code, "scan"); return; }
          st(`Leídas ${r.have} de ${r.n} partes. Sigue apuntando al código.`);
        }
      }catch(e){}
      scanTimer = setTimeout(tick, 250);
    };
    tick();
  }catch(e){
    fail(e && e.name === "NotAllowedError" ? "No hay permiso para usar la cámara. Usa «Abrir archivo» o «Pegar código»." : "No se pudo abrir la cámara. Usa «Abrir archivo» o «Pegar código».");

function trashHTML(){
  state.trash = state.trash.filter(t => Date.now() - t.at < 30 * 864e5);
  if(!state.trash.length) return "";
  const nom = t => t.item.nombre || t.item.tel || "Sin nombre";
  return `<div class="card" id="papelera"><h2>Papelera</h2><p class="fine">Lo que borras queda acá 30 días.</p>
    <ul class="kv">${state.trash.map(t => `<li><span class="k">${TRASH_T[t.tipo] || t.tipo} · borrado el ${fmtWhen(t.at)}</span><span class="v">${esc(nom(t))}</span><div class="inline"><button class="btn btn-ghost btn-sm" data-action="trash-restore" data-id="${esc(t.id)}">Recuperar</button></div></li>`).join("")}</ul>

function allPrintHTML(){

function printDoc(html){

}
async function downloadDoc(name, title, html, stId){
  const doc = `<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${title}</title><style>body{margin:16px;background:#fff}${PRINT_CSS}@media print{body{margin:0}}</style></head><body>${html}<script>setTimeout(function(){try{window.print()}catch(e){}},400)<\/script></body></html>`;
  const r = await saveFile(name, doc);
  const st = document.getElementById(stId);
  if(st) st.textContent = r === "saved" ? "Listo: el archivo quedó en Descargas. Ábrelo e imprime desde el navegador." : r === "declined" ? "No se guardó el archivo." : "No se pudo crear el archivo.";
}

/* Cómo llegar caminando: camino más corto por las calles (Dijkstra) */

function updateLive(){

    li.querySelector('[data-role="fill"]').style.width = Math.min(100, pct * 100).toFixed(1) + "%";
    li.querySelector('[data-role="pill"]').textContent = st === "ok" ? "Bien" : st === "warn" ? "Atención" : "Pasó el límite";

let audioCtx = null, whistle = null, metro = null, sosTimer = null, wakeLock = null;
function getCtx(){
  try{
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      audioCtx = new AC();
    }
    if(audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }catch(e){ return null; }
}
async function keepAwake(){
  try{ if("wakeLock" in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request("screen"); }catch(e){ wakeLock = null; }
}
function releaseAwake(){
  try{ if(wakeLock) wakeLock.release(); }catch(e){}
  wakeLock = null;
}
function startWhistle(){
  const ctx = getCtx();
  if(!ctx) return;
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = "square";
  osc.frequency.value = 3100;
  gain.gain.value = 0.0001;
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  let next = ctx.currentTime + 0.05;
  const schedule = () => {
    while(next < ctx.currentTime + 1.5){
      for(let k = 0; k < 3; k++){
        const t = next + k * 0.65;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.linearRampToValueAtTime(0.25, t + 0.02);
        gain.gain.setValueAtTime(0.25, t + 0.4);
        gain.gain.linearRampToValueAtTime(0.0001, t + 0.43);
      }
      next += 3 * 0.65 + 1.2;
    }
  };
  schedule();
  whistle = {osc, gain, timer:setInterval(schedule, 400)};
}
function stopWhistle(){
  if(!whistle) return;
  clearInterval(whistle.timer);
  try{
    whistle.gain.gain.cancelScheduledValues(0);
    whistle.gain.gain.value = 0;
    whistle.osc.stop();
  }catch(e){}
  whistle = null;
}
function beat(){
  const ctx = audioCtx;
  if(ctx){
    try{
      const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime;
      o.type = "sine";
      o.frequency.value = 1200;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.5, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
      o.connect(g);
      g.connect(ctx.destination);
      o.start(t);
      o.stop(t + 0.09);
    }catch(e){}
  }
  document.querySelectorAll("[data-pulse]").forEach(el => {
    el.classList.add("beat");
    setTimeout(() => el.classList.remove("beat"), 110);
  });
}
function startMetro(){
  getCtx();
  beat();
  metro = setInterval(beat, 60000 / 110);
  keepAwake();
}
function stopMetro(){
  if(!metro) return;
  clearInterval(metro);
  metro = null;
  if(ov.hidden) releaseAwake();
}

  if(e.target.matches("[data-ay-tel]")){ ui.ayuda.off[e.target.dataset.ayTel] = !e.target.checked; render(false); return; }
  const t = e.target;
  if(t.matches("[data-check]")){
    if(t.checked) state.checks[t.dataset.check] = true; else delete state.checks[t.dataset.check];
    save();
    t.closest(".check").classList.toggle("on", t.checked);
    refreshPrepMeta();
  }else if(t.matches("[data-ciudad]")){
    state.ciudad = CIUDADES[t.value] ? t.value : "";
    save(); render(false);
    const z = document.getElementById("locales");
    if(z) z.scrollIntoView({block:"start"});
  }else if(t.matches("[data-prov]")){
    state.provincia = PROVINCIAS.includes(t.value) ? t.value : "";
    save();
    render(false);
    const z = document.getElementById("zona");
    if(z) z.scrollIntoView({block:"start"});
  }else if(t.matches("select[data-ff]")){
    setFicha(t);
  }else if(t.matches("[data-tarea]")){
    state.plan.tareas = Object.assign({}, state.plan.tareas, {[t.dataset.tarea]:t.value});
    save();
  }else if(t.matches("[data-rec]")){
    state.recs[t.dataset.rec] = Object.assign({}, state.recs[t.dataset.rec], {months:Number(t.value)});
    save();
    render(false);
  }else if(t.matches("[data-corte]") && state.corte){
    state.corte.done = state.corte.done || {};
    state.corte.done[t.dataset.corte] = t.checked;
    save();
    t.closest(".check").classList.toggle("on", t.checked);
  }else if(t.matches("[data-dni]")){
    const file = t.files && t.files[0];
    t.value = "";
    if(file) setDni(file, t.dataset.dni);
  }else if(t.matches("[data-foto]")){
    const file = t.files && t.files[0];
    t.value = "";
    if(file) setFoto(file);
  }else if(t.matches("[data-share-sel]")){
    ui.share.sel[t.dataset.shareSel] = t.checked;
    if(ui.share.parts){ ui.share.parts = null; const q = document.getElementById("qrbox"); if(q) q.remove(); syncQrTimer(); }
  }else if(t.matches("[data-recv-sel]")){
    ui.share.recvSel[t.dataset.recvSel] = t.checked;
  }else if(t.id === "recv-file"){
    const f = t.files && t.files[0];
    t.value = "";
    if(!f) return;
    if(f.size > 5e6){ ui.share.rmsg = "Ese archivo es demasiado grande: no parece de Preparados."; render(false); return; }
    f.text().then(txt => receiveText(txt, "file"), () => { ui.share.rmsg = "No se pudo abrir el archivo."; render(false); });
  }
});
document.addEventListener("input", e => {
  if(e.target.id === "lav-litros"){
    const v = parseFloat(String(e.target.value).replace(",", "."));
    ui.calc.litros = isFinite(v) && v > 0 ? Math.min(v, 100000) : 0;
    updLav();
  }else if(e.target.matches("[data-ff]")){
    setFicha(e.target);
  }else if(e.target.id === "aviso-extra"){
    ui.aviso.extra = e.target.value.slice(0, 140);
    updAviso();
  }else if(e.target.id === "apr-q"){
    ui.apr.q = e.target.value.slice(0, 40);
    const pos = e.target.selectionStart; render(false);
    const i = document.getElementById("apr-q"); if(i){ i.focus(); try{ i.setSelectionRange(pos, pos); }catch(err){} }
  }else if(e.target.id === "ay-extra"){
    ui.ayuda.extra = e.target.value.slice(0, 140);
    updAyuda();
  }else if(e.target.matches("[data-pf]")){
    const [a, b] = e.target.dataset.pf.split(".");
    const val = e.target.value.slice(0, 120);
    if(b) state.plan[a] = Object.assign({}, state.plan[a], {[b]:val}); else state.plan[a] = val;
    save();
  }else if(e.target.id === "punto"){
    const ok = document.getElementById("punto-ok");
    if(ok) ok.textContent = "";
  }else if(e.target.id === "l-nombre"){
    ui.mapa.nombre = e.target.value.slice(0, 40);
  }else if(e.target.id === "map-q"){
    const m = ui.mapa; m.q = e.target.value; m.res = buscar(m.q);
    const ul = document.getElementById("map-res");
    if(ul) ul.innerHTML = m.res.map((r, i) => `<li><button type="button" data-action="map-res-pick" data-i="${i}"><span class="mr-t">${esc(r.tipo)}</span><span class="mr-n">${esc(r.n)}</span>${r.a ? `<span class="mr-a">${esc(r.a)}</span>` : ""}</button></li>`).join("") || (m.q.trim().length > 1 ? `<li class="mr-none">No encontré «${esc(m.q)}». Prueba con el nombre de una calle o «calle y calle».</li>` : "");
  }else if(e.target.matches("[data-yo]")){
    state.yo = e.target.value.slice(0, 40);
    save();
    if(ui.sub === "ayuda") updAyuda();
  }
});
document.addEventListener("submit", e => {
  if(e.target.id === "form-contacto"){ e.preventDefault(); addContact(e.target); }
  else if(e.target.id === "form-inv"){ e.preventDefault(); saveInv(e.target); }
  else if(e.target.id === "form-mem"){ e.preventDefault(); addMember(e.target); }
  else if(e.target.id === "form-lugar"){ e.preventDefault(); addLugar(); }
  else if(e.target.id === "form-dir"){ e.preventDefault(); dirBuscar(e.target); }
  else if(e.target.matches(".ren-form")){
    e.preventDefault();
    const l = state.lugares.find(x => x.id === e.target.dataset.ren), v = e.target.querySelector("input").value.trim().slice(0, 40);
    if(l && v){ l.nombre = v; l.at = Date.now(); save(); }
    ui.mapa.ren = null; drawMapa(); drawMapPanel();
  }
  else if(e.target.id === "form-ficha"){
    e.preventDefault();
    const n = e.target.querySelector("#f-nombre").value.trim();
    if(!n){ e.target.querySelector("#f-err").hidden = false; e.target.querySelector("#f-nombre").focus(); }
    else newFicha(n);
  }
});
document.addEventListener("keydown", e => {
  if(!ov.hidden){
    if(e.key === "Escape" || e.key === "Enter" || e.key === " "){ e.preventDefault(); closeOverlay(); }
    return;
  }
  if(ui.tab === "guias" && ui.guide && ui.mode === "paso"){
    const tag = (e.target.tagName || "").toLowerCase();
    if(tag === "input" || tag === "textarea" || tag === "select") return;
    if(e.key === "ArrowRight"){ const n = view.querySelector('[data-action="next"]'); if(n){ e.preventDefault(); n.click(); } }
    else if(e.key === "ArrowLeft"){ const p = view.querySelector('[data-action="prev"]'); if(p && !p.disabled){ e.preventDefault(); p.click(); } }
  }
});

/* ---------- Conexión ---------- */
const net = document.getElementById("net");
function updNet(){
  const on = navigator.onLine !== false;
  net.textContent = on ? "Con conexión" : "Sin conexión";
  net.classList.toggle("off", !on);
}
function netChange(){
  updNet();
  if(ui.share.scanning || !ov.hidden) return;
  const tag = (document.activeElement && document.activeElement.tagName || "").toLowerCase();
  if(tag === "input" || tag === "textarea") return;
  if((ui.tab === "inicio" && (!ui.sub || ui.sub === "aviso")) || (ui.tab === "numeros" && ui.planSeg === "compartir")) render(false);
}
window.addEventListener("online", netChange);
window.addEventListener("offline", netChange);
document.addEventListener("visibilitychange", () => { if(document.hidden && ui.share.scanning){ stopScan(); render(false); } });

/* ---------- Inicio ---------- */
load();
const hash = (location.hash || "").slice(1);
if(["guias","preparar","linterna","numeros","aprender"].includes(hash)) ui.tab = hash;
else if(hash === "inventario"){ ui.tab = "preparar"; ui.prep = "inv"; }
else if(hash === "plan"){ ui.tab = "numeros"; ui.planSeg = "familia"; }
else if(hash === "ficha"){ ui.tab = "numeros"; ui.planSeg = "ficha"; }
else if(hash === "compartir"){ ui.tab = "numeros"; ui.planSeg = "compartir"; }
else if(hash === "extremo"){ ui.tab = "guias"; ui.extOpen = true; }
else if(hash === "mapa") ui.sub = "mapa";
else if(hash === "aviso") ui.sub = "aviso";
else if(hash === "ayuda") ui.sub = "ayuda";
else if(hash === "llevar") ui.sub = "llevar";
else if(hash === "30dias") ui.sub = "mes";
else if(hash === "radio") ui.sub = "radio";
else if(hash === "manual") ui.sub = "manual";
else if(hash === "corte") ui.sub = "corte";
else if(hash.indexOf("guia-") === 0 && GUIDES.some(g => g.id === hash.slice(5))){ ui.tab = "guias"; ui.guide = hash.slice(5); }
updNet();
render(false);
ensurePersist(false);
if(hash === "extremo"){ const z = document.getElementById("extremo"); if(z) z.scrollIntoView({block:"start"}); }
})();
</script>
