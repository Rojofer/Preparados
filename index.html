<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1324">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Preparados</title>
<meta name="description" content="Prototipo de app de emergencias para el hogar en Argentina: instructivos ilustrados, mochila y botiquín mínimos, reserva de comida, plan familiar y datos que pasan de celular a celular sin internet.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: app de una mano. Una columna de 560 px, barra superior fija, pestañas abajo al alcance del pulgar y botones grandes como señalética. */
:root{
  /* Color: azul de defensa civil como base, naranja de alta visibilidad como señal, semáforo para estados */
  --bg:#EDF0F5;
  --surface:#FFFFFF;
  --surface-2:#E2E7EF;
  --line:#C9D2DE;
  --ink:#0F1F3D;
  --ink-2:#4A5874;
  --tile:#14284B;
  --tile-edge:#14284B;
  --tile-ink:#FFFFFF;
  --tile-sub:#C7D3EA;
  --signal:#F26A1B;
  --on-signal:#0F1F3D;
  --signal-ink:#A84300;
  --blue:#1F4FB8;
  --on-blue:#FFFFFF;
  --focus:#1F4FB8;
  --ok:#17672F;
  --ok-soft:#DDF0E3;
  --warn:#8A5A00;
  --warn-fill:#F6C744;
  --warn-soft:#FCEFC7;
  --crit:#B3261E;
  --crit-soft:#F8DEDB;
  --on-crit:#FFFFFF;
  --flash:#FFFFFF;
  --flash-off:#000000;
  --flash-hint:#7A7A7A;
  /* Ilustraciones: trazo azul marino, rellenos planos y el mismo naranja de señal */
  --il-bg:#E7ECF4;
  --il-ink:#0F1F3D;
  --il-fill:#FFFFFF;
  --il-fill-2:#CDD6E4;
  --il-accent:#F26A1B;
  --il-water:#5B9BF0;
  --il-water-soft:#D3E5FB;
  --il-cold:#C4E6F6;
  --il-person:#A9BAD6;
  --il-person-2:#4C6290;
  --il-light:#FFD447;
  --il-ok:#1E8A47;
  --il-no:#C9302C;
  --il-on-badge:#FFFFFF;
  --il-smoke:#A3AEC0;
  --il-meat:#D2605A;
  --il-turbid:#B08D5B;
  --il-fuel:#3C4250;
  --il-flame:#2F6FDB;
  --map-bg:#EEF1EC; --map-road:#FFFFFF; --map-main:#F6D58E; --map-edge:#C3C9D3; --map-park:#C9E3C0; --map-water:#8DB8E8; --map-rail:#8A8F99; --map-label:#3A4150; --map-poi:#7A5BC2; --map-police:#2F5DB8;
  /* Tipo: condensada de señalética para títulos, hiperlegible para leer bajo estrés, monoespaciada para números */
  --font-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-data:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:12px;
  --tabbar-h:66px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1324; --surface:#111D33; --surface-2:#1A2842; --line:#2A3A57;
    --ink:#E9EEF6; --ink-2:#A7B3C8;
    --tile:#1A2C4E; --tile-edge:#2A3A57; --tile-ink:#F2F5FA; --tile-sub:#A9B8D3;
    --signal:#FF8A3D; --on-signal:#0A1324; --signal-ink:#FFA466;
    --blue:#8DB2FF; --on-blue:#0A1324; --focus:#8DB2FF;
    --ok:#5BD08A; --ok-soft:#173A28;
    --warn:#F6C744; --warn-fill:#F6C744; --warn-soft:#3A3115;
    --crit:#FF7A70; --crit-soft:#41201F; --on-crit:#0A1324;
    --il-bg:#16233C; --il-ink:#DCE4F2; --il-fill:#22324F; --il-fill-2:#34476A; --il-accent:#FF8A3D;
    --il-water:#4F8FEA; --il-water-soft:#1F3C66; --il-cold:#1E4D66; --il-person:#5C7296; --il-person-2:#B7C6E2;
    --il-light:#FFD447; --il-ok:#33B36B; --il-no:#F0625A; --il-on-badge:#FFFFFF; --il-smoke:#5D6A80;
    --il-meat:#E07A72; --il-turbid:#A88A5E; --il-fuel:#A9B2C4; --il-flame:#5C9BFF;
    --map-bg:#14203A; --map-road:#3A4B6C; --map-main:#8C7440; --map-edge:#0C1528; --map-park:#1E3B2E; --map-water:#2F5E99; --map-rail:#6E7890; --map-label:#D3DBEA; --map-poi:#A98BF0; --map-police:#7FA6FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1324; --surface:#111D33; --surface-2:#1A2842; --line:#2A3A57;
  --ink:#E9EEF6; --ink-2:#A7B3C8;
  --tile:#1A2C4E; --tile-edge:#2A3A57; --tile-ink:#F2F5FA; --tile-sub:#A9B8D3;
  --signal:#FF8A3D; --on-signal:#0A1324; --signal-ink:#FFA466;
  --blue:#8DB2FF; --on-blue:#0A1324; --focus:#8DB2FF;
  --ok:#5BD08A; --ok-soft:#173A28;
  --warn:#F6C744; --warn-fill:#F6C744; --warn-soft:#3A3115;
  --crit:#FF7A70; --crit-soft:#41201F; --on-crit:#0A1324;
  --il-bg:#16233C; --il-ink:#DCE4F2; --il-fill:#22324F; --il-fill-2:#34476A; --il-accent:#FF8A3D;
  --il-water:#4F8FEA; --il-water-soft:#1F3C66; --il-cold:#1E4D66; --il-person:#5C7296; --il-person-2:#B7C6E2;
  --il-light:#FFD447; --il-ok:#33B36B; --il-no:#F0625A; --il-on-badge:#FFFFFF; --il-smoke:#5D6A80;
  --il-meat:#E07A72; --il-turbid:#A88A5E; --il-fuel:#A9B2C4; --il-flame:#5C9BFF;
  --map-bg:#14203A; --map-road:#3A4B6C; --map-main:#8C7440; --map-edge:#0C1528; --map-park:#1E3B2E; --map-water:#2F5E99; --map-rail:#6E7890; --map-label:#D3DBEA; --map-poi:#A98BF0; --map-police:#7FA6FF;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{margin:0;font-family:var(--font-display);font-weight:700;line-height:1.08;text-wrap:balance;color:var(--ink)}
h1{font-size:36px;letter-spacing:.005em}
h2{font-size:24px}
h3{font-size:19px}
p{margin:0}
a{color:var(--blue)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
h1:focus{outline:none}
.mono{font-family:var(--font-data);font-variant-numeric:tabular-nums}
.ic{width:24px;height:24px;flex:none}

/* Barra superior */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar-in{max-width:592px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink)}
.mark{width:13px;height:13px;background:var(--signal);transform:rotate(45deg);border-radius:2px;flex:none}
.net{display:flex;align-items:center;gap:6px;min-width:0;font-size:13px;font-weight:700;color:var(--ok);white-space:nowrap}
.net::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.net.off{color:var(--warn)}

/* Vista */
.view{display:block;max-width:592px;margin:0 auto;padding-block:20px calc(var(--tabbar-h) + 88px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:16px}
.intro{display:flex;flex-direction:column;gap:6px}
.lede{color:var(--ink-2)}
.sec{font-size:22px;margin-top:10px}
.sec-lede{margin-top:-8px}
.fine{font-size:14px;color:var(--ink-2);line-height:1.45}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.inline{display:flex;flex-wrap:wrap;align-items:center;gap:10px}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:12px;font-weight:700;font-size:17px;line-height:1.2;text-align:center;text-decoration:none}
.btn .ic{width:20px;height:20px}
.btn-sm{min-height:40px;padding:0 14px;font-size:15px;border-radius:10px}
.btn-big{width:100%;min-height:60px;font-size:20px}
.btn-primary{background:var(--blue);color:var(--on-blue)}
.btn-signal{background:var(--signal);color:var(--on-signal)}
.btn-ghost{background:var(--surface-2);color:var(--ink)}
.btn-outline{background:transparent;color:var(--blue);border:1.5px solid var(--blue)}
.btn-danger{background:var(--crit);color:var(--on-crit)}
.back{display:inline-flex;align-items:center;gap:2px;align-self:flex-start;min-height:40px;padding-right:8px;font-weight:700;color:var(--blue)}
.back .ic{width:22px;height:22px}

/* Inicio */
.banner{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);background:var(--warn-soft);border:1px solid var(--warn-fill);color:var(--ink);text-align:left}
.banner-txt{display:flex;flex-direction:column;line-height:1.3}
.banner-txt span{font-size:15px;color:var(--ink-2)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--warn-fill);animation:ping 1.8s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 var(--warn-fill)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:row;align-items:center;gap:10px;min-height:68px;padding:10px 12px;border-radius:14px;background:var(--tile);color:var(--tile-ink);border:1px solid var(--tile-edge);text-align:left}
.tile .ic{flex:none;width:28px;height:28px;color:var(--signal)}
.tile .t-label{font-family:var(--font-display);font-weight:700;font-size:20px;line-height:1.05;text-wrap:balance}
.tile .t-hint{font-size:14px;line-height:1.3;color:var(--tile-sub)}
.tile.signal{background:var(--signal);border-color:var(--signal);color:var(--on-signal)}
.tile.signal .ic,.tile.signal .t-hint{color:var(--on-signal)}
.tile:active,.tool:active{transform:scale(.985)}
.call{flex-direction:row;align-items:center;justify-content:space-between;gap:12px}
.call-txt{display:flex;flex-direction:column;min-width:0}
.call-num{font-weight:600;font-size:34px;line-height:1}
.call-label{font-size:15px;color:var(--ink-2)}
.pbar{display:flex;flex-direction:column;gap:6px}
.pbar-head{display:flex;justify-content:space-between;gap:12px;font-weight:700;font-size:16px}
.pbar-head .mono{font-weight:500;font-size:15px;color:var(--ink-2);white-space:nowrap}
.bar{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar>span{display:block;height:100%;width:0;border-radius:6px;background:var(--blue);transition:width .3s}

/* Guías */
.glist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.glist li+li{border-top:1px solid var(--line)}
.grow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;padding:14px 10px 14px 14px;text-align:left}
.g-ic{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--tile);color:var(--signal)}
.g-ic .ic{width:22px;height:22px}
.g-txt{display:flex;flex-direction:column;min-width:0}
.g-txt strong{font-size:18px;line-height:1.25}
.g-txt span{font-size:15px;line-height:1.35;color:var(--ink-2)}
.g-txt .tagi{align-self:flex-start;margin-top:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;line-height:1.5;background:var(--warn-soft);color:var(--ink)}
.g-meta{display:flex;align-items:center;gap:2px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.g-meta .ic{width:18px;height:18px}
.seg{display:grid;gap:4px;padding:4px;border-radius:12px;background:var(--surface-2)}
.seg-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.seg-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg button{min-height:42px;padding:0 6px;border-radius:9px;border:1px solid transparent;font-weight:700;font-size:15px;line-height:1.15;text-align:center;color:var(--ink-2)}
.seg button[aria-selected="true"]{background:var(--surface);border-color:var(--line);color:var(--ink)}
.segs{display:flex;gap:4px}
.segs span{flex:1;height:6px;border-radius:3px;background:var(--surface-2)}
.segs span.done{background:var(--blue)}
.segs span.cur{background:var(--signal)}
.step{display:flex;flex-direction:column;gap:12px;min-height:280px;padding:14px 14px 18px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.step-meta{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-inline:4px}
.step h2,.step>p{padding-inline:4px}
.phase,.phase-h{font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--signal-ink)}
.count{font-size:14px;color:var(--ink-2);white-space:nowrap}
.step h2{font-size:31px;line-height:1.05}
.step p{font-size:19px}
.act{align-self:flex-start;margin-top:auto;margin-left:4px}
.stepnav{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.allsteps{display:flex;flex-direction:column;gap:8px}
.phase-h{margin-top:8px}
.all{margin:0;padding:0 0 0 34px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.all li{padding:12px 14px 14px 4px}
.all li+li{border-top:1px solid var(--line)}
.all li::marker{font-family:var(--font-data);font-weight:600;color:var(--ink-2)}
.all li strong{display:block;font-size:18px;line-height:1.3}
.all li span{display:block;color:var(--ink-2)}
.all .act{margin:10px 0 0}
.sources{font-size:14px;line-height:1.6;color:var(--ink-2);border-top:1px solid var(--line);padding-top:4px}
.sources summary{display:flex;align-items:center;gap:8px;min-height:44px;cursor:pointer;font-weight:700;color:var(--ink-2);list-style:none}
.sources summary::-webkit-details-marker{display:none}
.sources summary::after{content:"";width:8px;height:8px;margin-left:2px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .15s}
.sources[open] summary::after{transform:rotate(-135deg) translateY(-1px)}
.src-body{display:flex;flex-direction:column;gap:6px;padding-bottom:8px}
.keys{display:flex;flex-direction:column;gap:10px;padding:14px 16px 16px;border-radius:var(--r);background:var(--tile);color:var(--tile-ink)}
.keys .keys-h{font-size:21px;color:var(--tile-ink)}
.keys ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.keys li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;line-height:1.4}
.keys li::before{content:"";width:10px;height:10px;margin:7px 0 0 3px;border-radius:2px;background:var(--signal);transform:rotate(45deg)}

/* Ilustraciones */
.il-wrap{margin:0;border-radius:12px;overflow:hidden;line-height:0}
.il{display:block;width:100%;height:auto}
.all .il-wrap{max-width:300px;margin:2px 0 10px}
.il-bg{fill:var(--il-bg)}
.il-floor{fill:var(--il-fill-2)}
.il-o{fill:none;stroke:var(--il-ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.il-o2{fill:none;stroke:var(--il-ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.il-w,.il-g,.il-a,.il-waters,.il-cold,.il-p,.il-p2,.il-smoke,.il-red,.il-sun,.il-heart,.il-dk,.il-leaf{stroke:var(--il-ink);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.il-dk{fill:#323A4C}
.il-leaf{fill:var(--il-ok)}
.il-w{fill:var(--il-fill)}
.il-g{fill:var(--il-fill-2)}
.il-a,.il-aa{fill:var(--il-accent)}
.il-asoft{fill:var(--il-accent);opacity:.22}
.il-waters{fill:var(--il-water-soft)}
.il-water{fill:var(--il-water)}
.il-cold{fill:var(--il-cold)}
.il-p{fill:var(--il-person)}
.il-p2{fill:var(--il-person-2)}
.il-smoke{fill:var(--il-smoke)}
.il-red{fill:var(--il-meat)}
.il-sun,.il-light{fill:var(--il-light)}
.il-glow{fill:var(--il-light);opacity:.45}
.il-heart{fill:var(--il-no)}
.il-boltw{fill:var(--il-light);stroke:var(--il-ink);stroke-width:2;stroke-linejoin:round}
.il-turbid{fill:var(--il-turbid)}
.il-fuel{fill:var(--il-fuel)}
.il-flame{fill:var(--il-flame)}
.il-ok{fill:var(--il-ok)}
.il-no{fill:var(--il-no)}
.il-mark{fill:none;stroke:var(--il-on-badge);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.il-stream{fill:none;stroke:var(--il-water);stroke-width:6;stroke-linecap:round;stroke-dasharray:10 8}
.il-streamt{fill:none;stroke:var(--il-turbid);stroke-width:6;stroke-linecap:round}
.il-arrow{fill:none;stroke:var(--il-accent);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.il-dash{fill:none;stroke:var(--il-accent);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:6 7}
.il-ring{fill:none;stroke:var(--il-accent);stroke-width:3;stroke-dasharray:6 6}
.il-lo{fill:none;stroke:var(--il-ink);stroke-linecap:round;stroke-linejoin:round}
.il-l1{fill:none;stroke:var(--il-person);stroke-linecap:round;stroke-linejoin:round}
.il-l2{fill:none;stroke:var(--il-person-2);stroke-linecap:round;stroke-linejoin:round}
.il-tx{font-family:var(--font-data);font-weight:600;font-size:18px;fill:var(--il-ink)}
.il-txs{font-family:var(--font-data);font-weight:600;font-size:13px;fill:var(--il-ink)}
.il-txon{font-family:var(--font-data);font-weight:600;font-size:22px;fill:var(--on-signal)}

/* Práctica */
.quiz{display:flex;flex-direction:column;gap:12px}
.q-n{font-size:13px;color:var(--ink-2)}
.q-t{font-size:24px;line-height:1.15}
.q-opts{display:flex;flex-direction:column;gap:8px}
.q-opt{display:block;width:100%;min-height:50px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;line-height:1.3;text-align:left}
.q-opt:disabled{opacity:1;cursor:default}
.q-opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.q-opt.bad{border-color:var(--crit);background:var(--crit-soft)}
.q-opt.ok::after{content:"  ✓";color:var(--ok)}
.q-opt.bad::after{content:"  ✗";color:var(--crit)}
.q-fb{font-size:16px}
.q-fb.ok strong{color:var(--ok)}
.q-fb.bad strong{color:var(--crit)}

/* Corte de luz */
.timer{display:flex;flex-direction:column;gap:6px;padding:18px;border-radius:16px;background:var(--tile);color:var(--tile-ink)}
.digits{font-weight:600;font-size:64px;line-height:1;letter-spacing:-.02em}
.timer .unit{font-size:15px;color:var(--tile-sub)}
.limits,.verdicts{list-style:none;margin:0;padding:0 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.lim,.verdicts li{display:flex;flex-direction:column;gap:8px;padding:14px 0}
.lim+.lim,.verdicts li+li{border-top:1px solid var(--line)}

.hs-main>summary{background:var(--tile)}.hs-main .hs-t strong{color:var(--tile-ink)}.hs-main .hs-t span{color:var(--tile-sub)}.hs-main>summary .hs-chev{border-color:var(--tile-ink)}
.hs-body{display:flex;flex-direction:column;gap:12px;padding:14px}
.hs-body .btn .ic{width:20px;height:20px}
.q911{border:2px solid var(--crit)}.q911 .ic{color:var(--crit)}
.tools4{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tool4{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:12px;background:var(--surface-2);font-size:14px;font-weight:700;line-height:1.2;text-align:center;min-height:84px;justify-content:center}
.tool4 .ic{width:26px;height:26px;color:var(--signal)}
@media (max-width:340px){.tools4{grid-template-columns:repeat(2,minmax(0,1fr))}.sb{font-size:14px}}
.apr-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.apr-row{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:52px;padding:10px 12px;border-radius:10px;text-align:left;font-size:17px;font-weight:700;background:var(--surface-2)}
.apr-row .mono{flex:none;font-size:13px;font-weight:500;color:var(--ink-2)}
.apr-art{display:flex;flex-direction:column;gap:12px;max-width:62ch;font-size:18px;line-height:1.55}
.apr-art h1{font-size:32px;line-height:1.1}
.apr-art h3{font-size:20px;margin-top:8px}
.apr-art ul,.apr-art ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.apr-tip,.apr-ojo{padding:14px;border-radius:12px;display:flex;flex-direction:column;gap:4px}
.apr-tip{background:var(--surface-2);border-left:4px solid var(--ok)}
.apr-tip strong{color:var(--ok);font-size:14px;text-transform:uppercase;letter-spacing:.06em}
.apr-ojo{background:var(--crit-soft,var(--surface-2));border-left:4px solid var(--crit)}
.apr-ojo strong{color:var(--crit);font-size:14px;text-transform:uppercase;letter-spacing:.06em}
.apr-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.apr-nav .btn{flex:1 1 140px;white-space:normal;text-align:center}
.radios{list-style:none;margin:0 0 6px;padding:0;display:flex;flex-direction:column;gap:6px}
.radios li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:2px solid transparent}
.radios li.on{border-color:var(--ok)}
.r-f{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:64px;padding:6px 4px;border-radius:10px;background:var(--tile);color:var(--tile-ink);font-size:20px;font-weight:600;line-height:1}
.r-f small{font-size:11px;letter-spacing:.08em;color:var(--signal);margin-bottom:3px}
.r-t{display:flex;flex-direction:column;line-height:1.3;min-width:0}.r-t span{font-size:14px;color:var(--ink-2)}
.r-ok{grid-column:2;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);min-height:36px;cursor:pointer}
.r-ok input{width:20px;height:20px;accent-color:var(--ok)}
.kv-list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.coms{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.coms li{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.coms h3{display:flex;gap:10px;align-items:center;font-size:18px}
.coms h3 .mono{display:grid;place-items:center;flex:none;width:28px;height:28px;border-radius:50%;background:var(--signal);color:var(--on-signal,#fff);font-size:15px}
html.ahorro{--bg:#000;--surface:#000;--surface-2:#0B0F17;--line:#22293A}
html.ahorro body{background:#000}
html.ahorro .topbar,html.ahorro nav,html.ahorro .tabbar{background:#000!important;border-color:#22293A!important}
html.ahorro *{animation:none!important;transition:none!important}
.ahorro-v{gap:14px}
.ah-top{display:flex;justify-content:space-between;font-size:18px;color:var(--ink-2)}
.ah-big{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ah-b{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:86px;border-radius:14px;border:2px solid #333;background:#000;color:#E9EEF6;font-weight:700;font-size:17px;text-decoration:none}
.ah-b .ic{width:28px;height:28px}
.ah-911{border-color:var(--crit);color:var(--crit);font-family:var(--font-data);font-size:24px}
.ah-ay{background:var(--crit);border-color:var(--crit);color:#000}
.ah-dl{display:grid;gap:4px 0;margin:0}
.ah-dl dt{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-top:10px}
.ah-dl dd{margin:0;font-size:19px;line-height:1.4}
.ah-tels{display:flex;flex-wrap:wrap;gap:8px}
.ah-tels a{padding:8px 12px;border:1px solid #333;border-radius:10px;color:#E9EEF6;text-decoration:none;font-weight:700}
.ah-tips summary{cursor:pointer;color:var(--ink-2)}
.ah-tips ul{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--ink-2)}
.auto-line{font-size:16px;line-height:1.4;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.auto-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.auto-t{display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:12px;background:var(--surface-2);border:2px solid transparent;min-width:0}
.auto-t.warn{border-color:var(--crit)}
.auto-n{font-size:38px;font-weight:600;line-height:1}
.auto-u{font-size:13px;color:var(--ink-2)}
.auto-s{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.nav-row{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:var(--r);background:var(--surface);border:2px solid var(--blue)}
.nav-row-t{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;color:var(--blue)}.nav-row-t .ic{width:22px;height:22px}
.nav-row-b{display:flex;flex-wrap:wrap;gap:8px}.nav-row-b .btn{min-height:44px;font-size:16px}
.nr-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nr-pos{margin-top:-4px}
.nr-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.nr-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:10px 12px;border-radius:12px;background:var(--surface-2);text-align:left;min-height:56px}
.nr-t{display:flex;flex-direction:column;line-height:1.3;min-width:0}.nr-t strong{font-size:17px}.nr-t span{font-size:14px;color:var(--ink-2)}
.nr-go{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;background:var(--blue);color:var(--on-blue,#fff);font-weight:700}.nr-go .ic{width:18px;height:18px}
.nav-row.empty{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;text-align:left;color:var(--ink)}
.nav-row.empty strong{display:block;color:var(--blue)}.nav-row.empty span span{font-size:14px;color:var(--ink-2)}
.nav-main{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center}
.nav-dial{width:150px;height:150px}.nav-dial .ring{fill:var(--surface-2);stroke:var(--line);stroke-width:2}.nav-dial .needle{fill:var(--blue)}
#nav-arrow{transition:transform .25s ease}
.nav-big{font-family:var(--font-display);font-weight:700;font-size:40px;line-height:1}
.nav-instr{font-size:19px;line-height:1.4}
.nav-acc{font-size:14px;font-weight:700}.nav-acc.ok{color:var(--ok)}.nav-acc.mid{color:var(--signal-ink)}.nav-acc.bad{color:var(--crit)}

.nav-v #azmap{height:min(42vh,340px)}

.dir-card{border:2px solid var(--blue)}
.ren-form{display:flex;flex-direction:column;gap:8px;width:100%}
.nr-head .inline{gap:6px}

.fb{display:flex;flex-direction:column;gap:14px;padding:20px 18px;border-radius:16px;background:var(--surface);border:2px solid var(--crit)}

.fb dd.alert{color:var(--crit)}

.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tool{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:138px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left}
.tool .ic{width:30px;height:30px;color:var(--blue)}
.tool .t-label{margin-top:auto;font-family:var(--font-display);font-weight:700;font-size:23px;line-height:1.05}
.tool small{font-size:14px;line-height:1.3;color:var(--ink-2)}
.tool[aria-pressed="true"]{background:var(--signal);border-color:var(--signal);color:var(--on-signal)}
.tool[aria-pressed="true"] .ic,.tool[aria-pressed="true"] small{color:var(--on-signal)}
.metro-panel{align-items:center;text-align:center}
.pulse{display:grid;place-items:center;width:132px;height:132px;border-radius:50%;background:var(--surface-2);font-family:var(--font-data);font-weight:600;font-size:30px;transition:transform .08s,background-color .08s}
.pulse.beat{background:var(--signal);color:var(--on-signal);transform:scale(1.06)}

/* Números */
.nums{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.nums li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px}
.nums li+li{border-top:1px solid var(--line)}
.n-main{display:flex;flex-direction:column;min-width:0}
.n-num{font-weight:600;font-size:24px;line-height:1.15;overflow-wrap:anywhere;user-select:all}
.n-num.sm{font-size:19px}
.n-label{font-weight:700}
.n-desc{font-size:14px;line-height:1.35;color:var(--ink-2)}
.n-actions{display:flex;flex-direction:column;gap:6px;flex:none}
.empty{padding:16px;border:1.5px dashed var(--line);border-radius:var(--r);color:var(--ink-2)}

/* Pestañas y barra en vivo */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:592px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:var(--tabbar-h);font-size:13px;font-weight:700;text-align:center;color:var(--ink-2)}
.tab[aria-current="page"]{color:var(--blue)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--signal)}
.livebar{position:fixed;left:0;right:0;bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px));z-index:25;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.livebar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:12px;background:var(--signal);color:var(--on-signal);font-weight:700;pointer-events:auto}
.live-dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--on-signal);opacity:.35}
.live-dot.beat{opacity:1}
.livebar .btn{margin-left:auto;background:var(--on-signal);color:var(--signal)}

/* Pantalla completa: linterna y SOS */
#overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));background:var(--flash-off);cursor:pointer}
#overlay.lit{background:var(--flash)}
#overlay p{font-size:15px;font-weight:700;color:var(--flash-hint)}

@media (prefers-reduced-motion: reduce){
  .dot{animation:none}
  .tile:active,.tool:active{transform:none}
  .bar>span{transition:none}
  .pulse{transition:none}
  .pulse.beat{transform:none}
}
@media (max-width:360px){
  h1{font-size:32px}
  .tile .t-label{font-size:18px}
  .tool .t-label{font-size:21px}
  .digits{font-size:56px}
  .step h2{font-size:28px}
}

   steps:[

    {ph:"Si cierran la zona",img:"conf-permiso",t:"Permiso para circular",d:"Si las autoridades piden un permiso, tramítalo solo en el sitio oficial que indiquen (en 2020 fue el Certificado Único Habilitante, por internet y con el DNI). Guarda una captura y anota el número y el vencimiento en la ficha."},

    {ph:"Si cierran la zona",img:"conf-receta",t:"Salidas por salud",d:"Para ir al médico o a la farmacia, lleva la receta, el turno o el certificado médico. Ten medicamentos para un mes y el número de afiliado de la obra social."},
    {ph:"Los chicos",img:"conf-chicos",t:"Que sepan quiénes son",d:"Que las chicas sepan su nombre completo, su DNI y el teléfono de papá, y lleven una tarjeta en la mochila. Si viajan con un solo adulto o con otra persona, puede hacer falta una autorización.",a:{type:"ayuda",label:"Ver «Necesito ayuda»"}},

    {ph:"Para quedarse",img:"moc-papeles",t:"Preparados para días en casa",d:"Si el confinamiento dura, vale el mismo plan que un corte largo: comida sin heladera, agua, medicamentos y efectivo.",a:{type:"mes",label:"Plan 30 días sin luz"}}

   keys:["El 911 puede entrar con la antena de cualquier compañía: llama igual.","Un SMS corto sale con muy poca señal: usa «Necesito ayuda».","Sin nada de red, vale lo acordado: punto y horario de encuentro."],
   steps:[

  }).join("");
  const score = done === total

const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = v => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || ""); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
const fmtDate = d => `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
const daysTo = d => Math.round((d - today0()) / 864e5);
const addMonths = (d, n) => { const x = new Date(d); x.setMonth(x.getMonth() + n); return x; };
const enDias = n => n === 1 ? "1 día" : `${n} días`;
function invStatus(it){
  const d = parseISO(it.vence);
  if(!d) return {k:"mute", label:"Sin vencimiento", rank:3, days:1e9};
  const n = daysTo(d);
  if(n < 0) return {k:"crit", label:n === -1 ? "Venció ayer" : `Venció hace ${enDias(-n)}`, rank:0, days:n};
  if(n === 0) return {k:"crit", label:"Vence hoy", rank:0, days:0};
  if(n <= 30) return {k:"warn", label:`Vence en ${enDias(n)}`, rank:1, days:n};
  return {k:"ok", label:`Vence el ${fmtDate(d)}`, rank:2, days:n};
}
function recStatus(r){
  const st = state.recs[r.id] || {};
  const months = st.months || r.months;
  const last = parseISO(st.last);
  if(!last) return {k:"mute", label:"Sin registrar", due:false, months};
  const next = addMonths(last, months), n = daysTo(next);
  if(n < 0) return {k:"crit", label:`Atrasado ${enDias(-n)}`, due:true, months};
  if(n <= 14) return {k:"warn", label:n === 0 ? "Toca hoy" : `Toca en ${enDias(n)}`, due:true, months};
  return {k:"ok", label:`Próxima: ${fmtDate(next)}`, due:false, months};
}
function invSummary(){
  let venc = 0, pronto = 0;
  state.inv.forEach(it => { const s = invStatus(it); if(s.rank === 0) venc++; else if(s.rank === 1) pronto++; });
  return {venc, pronto, recs:REMINDERS.filter(r => recStatus(r).due).length};
}

function planFilled(){
  const p = state.plan;

}
function stepMiembros(){

      ? `<button class="btn btn-danger btn-sm" data-action="mem-del-do" data-id="${esc(m.id)}">Quitar</button><button class="btn btn-ghost btn-sm" data-action="mem-del-cancel">No</button>`

    : `<p class="fine">Todavía no agregaste a nadie.</p>`;

    <form id="form-mem" class="form-s" novalidate>
      <div class="grid2"><div class="field"><label class="lbl" for="m-nombre">Nombre</label><input id="m-nombre" maxlength="40" autocomplete="off" placeholder="Ej.: Martín"></div>

function stepTareas(){

function stepLugares(){
  const L = state.plan.lugares;

function stepContacto(){
  const c = state.plan.contacto;

function planText(){
  const p = state.plan, L = ["PLAN FAMILIAR DE EMERGENCIA"];
  if(p.miembros.length || p.mascotas) L.push("", "Quiénes somos:", ...p.miembros.map(m => `- ${m.nombre}${m.edad ? `, ${m.edad} años` : ""}${m.especial ? ` (atención especial${m.nota ? `: ${m.nota}` : ""})` : ""}`), ...(p.mascotas ? [`- Mascotas: ${p.mascotas}`] : []));
  const ts = TAREAS.filter(t => memberName(p.tareas[t.id]));
  if(ts.length) L.push("", "Quién hace qué:", ...ts.map(t => `- ${t.t}: ${memberName(p.tareas[t.id])}`));

  if(ls.length) L.push("", "Dónde nos encontramos:", ...ls.map(l => `- ${l.t}: ${p.lugares[l.id]}`));

    <div class="card"><h2>Simulacro</h2>${simHTML()}<p class="fine">Después, hablen de lo que salió mal para mejorarlo la próxima vez.</p></div>`;

function renderFamilia(){
  const s = ui.planStep;

  if(s === null){
    if(!planFilled()) return `<div class="card"><h2>Arma el plan en 4 pasos</h2><p>Quiénes viven en casa, qué hace cada uno, dónde se encuentran y a quién avisan. Lleva unos minutos y conviene hacerlo todos juntos.</p><button class="btn btn-primary btn-big" data-action="plan-step" data-n="0">Empezar</button></div>${foot}`;

async function setDni(file, k){
  const f = state.fichas.find(x => x.id === ui.fichaEdit);
  const st = m => { const e = document.getElementById("dni-st"); if(e) e.textContent = m; };
  if(!f) return;
  try{
    st("Preparando la foto…");
    const url = URL.createObjectURL(file);
    const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = url; });
    const side = 1100, sc = Math.min(1, side / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement("canvas");
    cv.width = Math.round(img.naturalWidth * sc); cv.height = Math.round(img.naturalHeight * sc);
    cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(url);
    let q = 0.72, data = cv.toDataURL("image/jpeg", q);
    while(data.length > 250000 && q > 0.3){ q -= 0.1; data = cv.toDataURL("image/jpeg", q); }
    if(!dniOk(data)) throw 0;
    const all = docsAll(); all[f.id] = Object.assign({}, all[f.id], {[k]:data, upd:Date.now()});
    if(!docsSave(all)){ st("No hay lugar en la memoria de la app para otra foto. Quita alguna y vuelve a intentar."); return; }

}

     "Hagan ruido: el silbato, gritar «¡llamamos a la policía!». Casi siempre el que entra quiere irse rápido.",
     "Si los encuentran, no resistan: entreguen lo que pidan. Miren detalles para contarle después a la policía.",
     "Cuando se vayan, sigan adentro hasta que llegue ayuda. Después hagan la denuncia."]],
   ["ojo","No pongas trampas ni elementos que puedan herir: son peligrosos para tu familia, para un bombero que entre a ayudar y pueden traerte problemas legales."],
   ["tip","Practiquen el plan una vez, como un juego, con la palabra clave. Que las chicas sepan llamar al 911 y decir la dirección de memoria."]]},
  {id:"puerta-comida", t:"Si alguien pide comida en la puerta", min:4, b:[
   ["p","En una crisis va a haber personas con hambre de verdad, y también quien use esa excusa para mirar o entrar. Se puede ayudar sin ponerse en riesgo."],
   ["ul",["Habla sin abrir: por la ventana, la reja o el portero. Nunca hagas pasar a desconocidos.",
     "No digas cuánto tienes ni muestres la despensa.",
     "Si deciden dar algo, que sea poco, ya preparado de antemano y que lo entregue un adulto, con otro adulto cerca.",
     "Cuenta dónde hay ayuda: comedores, parroquias, el municipio o la olla de la cuadra. Así ayudas más y no quedas expuesto.",
     "Desconfía de quien dice ser de CEAL, Camuzzi, la municipalidad o el gobierno: pide la credencial y llama a la empresa a su número oficial antes de abrir.",
     "Si alguien insiste o vuelve varias veces a mirar, avisa a los vecinos y a la policía."]],
   ["tip","Decidan en familia, con calma y antes de que pase, qué y cuánto pueden compartir. Así nadie tiene que decidir nervioso en la puerta."]]},
  {id:"vecinos-seg", t:"Los vecinos: la mejor protección", min:4, b:[
   ["p","Una cuadra organizada protege más que cualquier reja. Los que roban eligen lugares donde nadie mira y nadie avisa."],
   ["ul",["Conozcan a los vecinos de la cuadra: quién vive en cada casa, quién está solo, quién es mayor.",
     "Armen un grupo para avisarse. Si no hay señal, una señal acordada: tres pitadas de silbato es «vengan, hay problemas».",
     "Turnos para mirar la cuadra de día y avisar movimientos raros. No para enfrentar a nadie: para avisar y llamar al 911.",
     "Una luz encendida en algunas casas por turno ayuda a que la cuadra no quede toda a oscuras."]],
   ["tip","Esta semana, presenta a la familia a los vecinos de al lado y de enfrente. Intercambien teléfonos."]]}
 ]},
 {id:"familia", t:"Familia unida y ánimo", sub:"Roles, rutinas, cómo hablar del miedo con las chicas y cómo no pelearse.", ic:"heart", lec:[
  {id:"roles", t:"Cada uno con su tarea", min:3, b:[
   ["p","En una crisis, sentirse útil calma. Una tarea clara para cada uno, según la edad, reparte el trabajo y da sensación de control."],
   ["ul",["Agua: llenar y controlar los bidones.",
     "Despensa: anotar lo que se usa en el inventario de la app.",
     "Energía: cargar celulares, linternas y powerbanks con sol.",
     "El gato: comida, agua y piedras sanitarias.",
     "Ánimo: proponer un juego o una lectura cada noche."]],
   ["p","Una reunión corta por día, de diez minutos y siempre a la misma hora: cómo estamos, qué falta, qué hacemos mañana."],
   ["tip","Repartan hoy las tareas y escríbanlas en un papel en la heladera. Cambien los roles cada semana para que todos aprendan todo."]]},
  {id:"rutina", t:"Una rutina que ordena el día", min:3, b:[
   ["p","Cuando todo cambia, los horarios fijos dan seguridad, sobre todo a los chicos. Aprovechen la luz del día y dejen la noche para descansar."],
   ["ul",["Mañana: levantarse a la misma hora, desayunar juntos, tareas de la casa y del agua.",
     "Mediodía: comida principal, cocinada con gas para todos a la vez. Cargar todo con sol.",
     "Tarde: un rato de estudio o de aprender algo, otro de juego o de aire libre si es seguro.",
     "Noche: cena liviana temprano, reunión de diez minutos, juego o lectura con una sola luz, y a dormir."]],
   ["tip","Mantengan algo de la vida de siempre: el mate de la tarde, la música del domingo, la comida que les gusta."]]},
  {id:"miedo", t:"Hablar del miedo con las chicas", min:5, b:[
   ["p","Los chicos se dan cuenta de todo. Si no les explicamos, imaginan algo peor. Hablar con calma y con la verdad los ayuda."],
   ["ul",["Busquen un momento tranquilo y pónganse a su altura. Pregunten qué saben y qué sienten antes de explicar.",
     "Digan la verdad con palabras simples, adaptadas a la edad. No prometan lo que no saben: «no sé cuándo vuelve la luz, pero estamos preparados».",
     "Todo lo que sienten es normal: miedo, enojo, aburrimiento. No los apuren ni los obliguen a hablar.",
     "Limiten las noticias y las redes: mucha información asusta, y no todo lo que circula es cierto.",
     "Cuéntenles qué están haciendo para cuidarlos y denles una tarea: ayudar los hace sentir más seguros.",
     "Recuérdenles que mucha gente se ayuda en las emergencias."]],
   ["h","Señales de que les está costando"],
   ["ul",["Cambios en el sueño o en el apetito, pesadillas.","Irritabilidad, llanto fácil o encerrarse.","Dolores de panza o de cabeza sin causa clara.","Volver a conductas de cuando eran más chicas."]],
   ["p","Si las señales duran semanas o empeoran, consulten con el médico o el psicólogo de la escuela cuando se pueda."],
   ["tip","Cada noche, una ronda: «lo mejor y lo más difícil del día». Empiecen los adultos."]]},
  {id:"peleas", t:"Cuando hay tensión y peleas", min:3, b:[
   ["p","Hambre, frío, cansancio y encierro ponen a cualquiera de mal humor. Es esperable: lo importante es cómo se resuelve."],
   ["ul",["Las decisiones importantes, nunca enojados ni con hambre. Primero comer y descansar.",
     "Hablar de a uno y sin gritar. Quien está muy enojado puede pedir una pausa y volver en diez minutos.",
     "Hablar del problema, no de la persona: «faltó agua» en vez de «sos un desastre».",
     "Después de una pelea, reparar: pedir perdón también enseña.",
     "Cada uno necesita un rato a solas por día, aunque sea en un rincón."]],
   ["tip","Acuerden tres reglas de convivencia entre todos y escríbanlas junto a las tareas."]]},
  {id:"cuidar", t:"Cuidar al que cuida", min:3, b:[
   ["p","Los adultos sostienen al resto. Si papá o mamá se agotan, la familia entera lo siente. Cuidarse no es egoísmo: es parte del plan."],
   ["ul",["Turnos para descansar: nadie puede estar alerta todo el día.",
     "Comer y tomar agua aunque no haya ganas. Dormir lo más posible.",
     "Hablar con otro adulto de confianza de lo que preocupa, no solo de lo práctico.",
     "Pedir ayuda a tiempo: a la familia, a los vecinos, al médico."]],
   ["ojo","Si alguien de la casa habla de no querer vivir o de hacerse daño, no lo dejen solo. Llamen al 911 o a la Línea de Prevención del Suicidio: desde Azul y el resto del país, 0800 345 1435; en Buenos Aires y el Gran Buenos Aires, 135."]]},
  {id:"juegos", t:"Juegos y aprender sin luz", min:3, b:[
   ["p","Las noches sin luz pueden ser los mejores recuerdos de la familia si se llenan de juegos e historias."],
   ["ul",["Cartas: truco, chinchón, escoba de 15, carta alta.","Juegos sin nada: tutti frutti, veo veo, adivinanzas, 20 preguntas, el teléfono descompuesto.",
     "Contar historias por turnos: cada uno agrega una frase.","Leer en voz alta un capítulo por noche.","Un diario de la familia: cada día escribe o dibuja uno distinto.",
     "Cada uno enseña algo que sabe: un nudo, una receta, una canción, un truco de cartas."]],
   ["tip","Armen hoy una caja de «noches sin luz» con cartas, un libro, lápices y una linterna. Que no se use para otra cosa."]]}
 ]},
 {id:"saberes", t:"Saberes prácticos", sub:"Huerta, conservar alimentos, ahorrar gas, nudos, reparaciones, orientarse y primeros auxilios.", ic:"pot", lec:[
  {id:"huerta", t:"Una huerta chica en casa", min:5, b:[
   ["p","Con macetas, cajones o un pedazo de patio se pueden tener verduras frescas en pocas semanas. Además, es una tarea linda para hacer con las chicas."],
   ["h","Lo que crece rápido"],
   ["ul",["Rabanitos: listos en un mes.","Rúcula, lechuga y espinaca: de cuatro a seis semanas, y se cortan las hojas de afuera para que sigan dando.","Acelga: dura meses y aguanta el frío.","Perejil, cebolla de verdeo y albahaca, en macetas."]],
   ["h","Cuándo sembrar en Azul"],
   ["ul",["Otoño e invierno: acelga, espinaca, lechuga, rabanitos, arvejas, habas, ajo.","Primavera y verano: tomate, zapallito, choclo, porotos, albahaca."]],
   ["h","Lo básico"],
   ["ul",["Al menos seis horas de sol por día.","Tierra suelta con compost: restos de verdura, yerba usada y cáscaras, sin carne ni grasa.","Regar temprano o al atardecer, al pie de la planta.","Guarden semillas de lo que cosechan: tomate, zapallo y porotos dan semillas fáciles de secar."]],
   ["tip","Siembren esta semana un cajón de rabanitos y otro de rúcula. En un mes van a comer algo que plantaron ustedes."]]},
  {id:"conservar", t:"Conservar alimentos sin heladera", min:5, b:[
   ["p","Antes de la heladera, las familias conservaban con sol, sal, azúcar y vinagre. Sirve para que nada se eche a perder."],
   ["ul",["Secar al sol: rodajas finas de tomate, manzana, zapallo o hierbas, sobre una rejilla tapada con tela fina para las moscas. Se guardan en frascos secos.",
     "Dulces y mermeladas: el azúcar en cantidad conserva la fruta. Frascos limpios, hervidos y bien cerrados.",
     "Escabeches y encurtidos: el vinagre conserva verduras y carnes cocidas.",
     "Salar: la carne o el pescado bien cubiertos de sal se secan y duran."]],
   ["ojo","El botulismo puede venir de conservas caseras mal hechas. No guardes conservas caseras en aceite fuera de la heladera. Usa vinagre, cocina en olla a presión cuando se pueda y hierve 10 minutos antes de comer cualquier conserva casera. Si un frasco está abombado, huele raro o la tapa salta, tíralo sin probarlo."],
   ["tip","Hagan una mermelada juntos con fruta de estación. Etiqueten el frasco con la fecha."]]},
  {id:"gas", t:"Cocinar gastando poco gas", min:3, b:[
   ["p","Si el gas baja de presión o pasan a usar garrafa, cada minuto de hornalla cuenta."],
   ["ul",["Siempre con tapa: hierve más rápido y gasta menos.","Legumbres y arroz en remojo desde la noche anterior: se cocinan en la mitad del tiempo.",
     "Olla a presión: ahorra mucho gas en guisos y legumbres.",
     "Cocción con calor guardado: hervir 5 minutos, tapar y envolver la olla en frazadas o meterla en una caja con diarios. En una o dos horas termina de cocinarse sola.",
     "Cocinar una vez para varias comidas y para todos a la vez.","Llama justa: que no salga por los costados de la olla."]],
   ["tip","Prueben un domingo hacer arroz o lentejas con calor guardado. ¿Cuánto tardó?"]]},
  {id:"nudos", t:"Cuatro nudos que sirven", min:4, b:[
   ["p","Con una soga y estos nudos se arma un tendedero, se ata una lona, se asegura una carga o se rescata a alguien."],
   ["h","As de guía: un lazo que no se cierra"],
   ["ol",["Haz un ojo chico en la soga, con la punta larga por debajo.","Pasa la punta por el ojo, de abajo hacia arriba.","Rodea por detrás la parte larga de la soga.","Vuelve a meter la punta por el ojo, de arriba hacia abajo, y ajusta."]],
   ["p","Para recordarlo: «el conejo sale del pozo, da la vuelta al árbol y vuelve al pozo»."],
   ["h","Ballestrinque: para atar a un poste"],
   ["ol",["Da una vuelta alrededor del poste.","Cruza por encima de esa vuelta y da otra vuelta.","Pasa la punta por debajo del cruce y ajusta."]],
   ["h","Nudo llano: para unir dos sogas iguales"],
   ["p","Derecha sobre izquierda y por debajo; después izquierda sobre derecha y por debajo. Si queda torcido, hiciste el «nudo de vieja»: desarma y repite."],
   ["h","Tensor: para tensar un tendedero o una lona"],
   ["p","Rodea el poste, vuelve hacia la soga y da dos vueltas alrededor de ella hacia adentro y una más hacia afuera. El nudo se desliza para tensar y se traba solo."],
   ["tip","Una soga de dos metros por persona y un concurso: quién hace el as de guía con los ojos cerrados."]]},
  {id:"reparar", t:"Reparaciones básicas", min:4, b:[
   ["p","Sin servicios ni negocios abiertos, saber arreglar lo simple hace la diferencia."],
   ["h","Saber dónde está y cómo se cierra"],
   ["ul",["La llave de paso del agua de la casa.","La llave del gas, junto al medidor y en cada artefacto.","El tablero de la luz: bajar la llave general cuando hay un corte, para que la vuelta de la luz no queme nada."]],
   ["h","Caja de herramientas mínima"],
   ["ul",["Destornilladores, pinza, martillo, llave francesa.","Cinta aisladora, cinta de embalar ancha, precintos y alambre.","Clavos y tornillos surtidos, una lona y una soga."]],
   ["h","Arreglos que conviene saber"],
   ["ul",["Una canilla que gotea: cerrar la llave de paso, desarmar y cambiar el cuerito.","Un vidrio roto: cinta de embalar o una lona y madera por fuera.","Un inodoro tapado sin químicos: agua caliente, no hirviendo, y una sopapa."]],
   ["ojo","Con el gas, nunca improvises: si hay olor, cierra la llave, abre las ventanas, no prendas nada y llama a Camuzzi."],
   ["tip","Recorran la casa y que todos encuentren la llave de paso del agua, la del gas y el tablero."]]},
  {id:"orientarse", t:"Orientarse sin GPS", min:4, b:[
   ["p","Si el celular se queda sin batería, el cielo sigue ahí."],
   ["ul",["El sol sale por el este y se pone por el oeste. En el hemisferio sur, al mediodía el sol está hacia el norte.",
     "Con un reloj de agujas: apunta el 12 hacia el sol. La línea que pasa justo por el medio entre el 12 y la aguja de la hora señala el norte.",
     "De noche, la Cruz del Sur: prolonga cuatro veces y media el palo largo de la cruz. Desde ese punto, baja la vista derecho al horizonte: ahí está el sur."]],
   ["h","En la ciudad"],
   ["ul",["Aprendan los nombres y el orden de las calles cercanas.","Elijan puntos de referencia que se vean de lejos: la iglesia, el tanque de agua, la plaza.","Antes de salir, miren el mapa de la app y fíjense hacia dónde queda la casa."]],
   ["tip","Una noche despejada, busquen juntos la Cruz del Sur y el sur."]]},
  {id:"clima", t:"Leer el cielo y el clima", min:3, b:[
   ["ul",["Nubes altas y enormes, como coliflores oscuras: tormenta en pocas horas.","El viento que cambia de golpe y refresca: la tormenta está cerca.",
     "En la zona, días de viento del sudeste suelen traer lluvia y frío.","Cielo despejado y sin viento en invierno: noche muy fría y helada.",
     "Rayo y trueno: cuenta los segundos entre los dos y divide por tres. Es la distancia en kilómetros. Menos de diez segundos: adentro ya."]],
   ["tip","Durante una semana, que alguien anote cada mañana cómo está el cielo y qué tiempo hizo. Se aprende a predecir."]]},
  {id:"auxilios", t:"Primeros auxilios sin médico cerca", min:5, b:[
   ["p","Lo básico para resolver lo común mientras llega la ayuda. Ante algo grave, siempre el 107 o el 911."],
   ["h","Heridas"],
   ["ul",["Lavar con mucha agua limpia y jabón. Sin algodón directo en la herida.","Si sangra, apretar fuerte con una gasa o un trapo limpio durante 10 minutos, sin levantar a mirar.","Tapar con una gasa y cambiarla cada día. Si se pone roja, caliente, con pus o hay fiebre, buscar atención."]],
   ["h","Quemaduras"],
   ["ul",["Agua fresca, no helada, durante 20 minutos.","Nada de pasta dental, manteca ni hielo. No reventar las ampollas.","Tapar con un paño limpio y húmedo."]],
   ["h","Deshidratación por diarrea o calor"],
   ["p","Suero casero: 1 litro de agua segura, 6 cucharaditas rasas de azúcar y media cucharadita rasa de sal. Tomar de a sorbos durante el día. Si hay sangre en la diarrea, vómitos que no paran, mucho sueño o no orina, buscar atención urgente."],
   ["h","Fiebre"],
   ["ul",["Ropa liviana, mucho líquido y descanso.","El antifebril, según el prospecto y el peso.","En bebés, o si dura más de dos días, consultar."]],
   ["tip","Revisen juntos el botiquín y que cada uno sepa dónde está y qué hay."]]},
  {id:"higiene", t:"Higiene para no enfermarse", min:3, b:[
   ["p","En una crisis larga, muchas enfermedades vienen del agua, las manos y la basura."],
   ["ul",["Lavarse las manos con agua y jabón antes de cocinar y comer, y después del baño. Si falta agua, alcohol en gel.",
     "El agua para tomar, siempre segura: hervida o con lavandina.",
     "La basura, en bolsas cerradas y lejos de la casa, para no atraer moscas ni ratas.",
     "Si no anda el inodoro, sigan la guía «Baño sin agua y basura».",
     "Ventilar la casa todos los días, aunque haga frío."]]]}
 ]},
 {id:"comunidad", t:"Comunidad y trueque", sub:"Organizarse con la cuadra, intercambiar sin dinero, compartir y cuidarse de los rumores.", ic:"pack", lec:[
  {id:"organizar", t:"Organizarse con la cuadra", min:4, b:[
   ["p","Ninguna familia sabe hacer todo ni tiene todo. Juntas, una cuadra tiene médico, electricista, cocinera, herramientas y huerta."],
   ["ol",["Una reunión corta con los vecinos, de día y en la vereda.","Una lista de quién sabe qué (salud, mecánica, electricidad, cocina, cuidar chicos) y quién tiene qué (generador, herramientas, huerta, auto).",
     "Otra lista de quién necesita ayuda: personas mayores, bebés, alguien con medicación o que vive solo.","Un lugar y una hora fijos para reunirse cada día, aunque no haya señal.","Una cartelera en un lugar visible con avisos y novedades."]],
   ["tip","Ofrezcan primero lo que ustedes saben hacer. La confianza se arma dando."]]},
  {id:"trueque", t:"Trueque: intercambiar sin dinero", min:4, b:[
   ["p","En la crisis de 2001, miles de argentinos se organizaron en clubes de trueque para cambiar productos y servicios sin pesos. Funciona si hay reglas claras."],
   ["h","Qué vale en una crisis"],
   ["ul",["Agua segura, comida no perecedera, pilas y velas.","Artículos de higiene, semillas y verduras de la huerta.","Saber hacer: arreglar, coser, cocinar, cuidar chicos, enseñar."]],
   ["h","Reglas para cambiar seguro"],
   ["ul",["De día, en un lugar público o en el punto de la cuadra, nunca en tu casa.","Lleva solo lo que vas a cambiar: no muestres todo lo que tienes.","Acuerda antes qué das y qué recibes.",
     "Nunca intercambies medicamentos con receta sin consultar a un médico."]],
   ["tip","Hagan una lista de tres cosas que la familia sabe hacer bien y que podría ofrecer."]]},
  {id:"compartir", t:"Compartir sin quedarse sin nada", min:3, b:[
   ["p","Ayudar a otros es parte de mantenerse humano, y también de que la cuadra sea segura. Se puede hacer con orden."],
   ["ul",["Decidan en familia una parte de las reservas para compartir y no la pasen.",
     "Mejor juntar entre todos: una olla comunitaria en la cuadra alimenta a más gente con menos gas y menos trabajo.",
     "Compartan saberes, no solo cosas: enseñar a potabilizar el agua o a hacer una huerta rinde más que un paquete de arroz.",
     "Prioridad para quien más lo necesita: chicos, personas mayores y enfermos."]]]},
  {id:"rumores", t:"Información confiable y rumores", min:3, b:[
   ["p","En una emergencia circulan muchos rumores, y algunos causan pánico o hacen que la gente tome malas decisiones."],
   ["ul",["Las fuentes: la radio, el municipio, Defensa Civil, la policía, CEAL y Camuzzi por sus canales oficiales.",
     "Antes de reenviar algo, pregúntate: ¿quién lo dice? ¿de cuándo es? ¿lo confirma alguien oficial?",
     "Una radio a pilas y una persona encargada de escuchar las noticias dos veces por día. Que cuente a la familia solo lo importante.",
     "Desconfía de mensajes que piden datos, dinero o que vayas a un lugar con urgencia."]],
   ["tip","Anoten en un papel las radios de Azul y de la zona, con su frecuencia, y péguenlo junto a la radio."]]}
 ]}
];
const APR_ALL = () => APRENDER.flatMap(t => t.lec.map(l => Object.assign({tema:t}, l)));
function aprBlock([k, v]){
  if(k === "p") return `<p>${v}</p>`;
  if(k === "h") return `<h3>${v}</h3>`;
  if(k === "ul") return `<ul>${v.map(x => `<li>${x}</li>`).join("")}</ul>`;
  if(k === "ol") return `<ol>${v.map(x => `<li>${x}</li>`).join("")}</ol>`;
  if(k === "tip") return `<aside class="apr-tip"><strong>Para hacer en familia</strong><p>${v}</p></aside>`;
  if(k === "ojo") return `<aside class="apr-ojo"><strong>Cuidado</strong><p>${v}</p></aside>`;
  return "";
}
function renderAprender(){
  const a = ui.apr || (ui.apr = {lec:null, q:"", open:"casa"});
  if(a.lec){
    const all = APR_ALL(), i = all.findIndex(l => l.id === a.lec), l = all[i];
    if(l){
      const prev = all[i - 1], next = all[i + 1];
      return `<section class="stack apr-read">
        <button class="back" data-action="apr-back">${icon("back")}${l.tema.t}</button>
        <article class="apr-art"><p class="phase">${l.tema.t} · ${l.min} min de lectura</p><h1>${l.t}</h1>${l.b.map(aprBlock).join("")}</article>
        <nav class="apr-nav" aria-label="Otras lecturas">${prev ? `<button class="btn btn-ghost" data-action="apr-lec" data-id="${prev.id}">← ${prev.t}</button>` : "<span></span>"}${next ? `<button class="btn btn-primary" data-action="apr-lec" data-id="${next.id}">${next.t} →</button>` : ""}</nav>
      </section>`;
    }
    a.lec = null;
  }
  const q = norm(a.q || "");
  const hits = q.length > 1 ? APR_ALL().filter(l => norm(l.t + " " + l.b.map(([, v]) => Array.isArray(v) ? v.join(" ") : v).join(" ")).includes(q)) : null;
  const row = l => `<li><button class="apr-row" data-action="apr-lec" data-id="${l.id}"><span>${l.t}</span><span class="mono">${l.min} min</span></button></li>`;
  return `<section class="stack">
    <div class="intro"><h1>Aprender</h1><p class="lede">Lecturas cortas para que la familia sepa más, se cuide y se mantenga unida.</p></div>

/* ---------- Días de autonomía: cuánto alcanza lo que hay en el inventario ---------- */
function parseCant(txt){
  const t = String(txt || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/(\d),(\d)/g, "$1.$2");
  const mx = t.match(/(\d+(?:\.\d+)?)\s*(?:x|de|por)\s*(\d+(?:\.\d+)?)\s*(l|lt|lts|litros?|kg|kilos?|g|gr|grs|gramos|ml|cc)\b/);
  if(mx){ const k = mx[3], tot = parseFloat(mx[1]) * parseFloat(mx[2]); return /^(l|lt|lts|litros?)$/.test(k) ? {n:tot, u:"l"} : /^(kg|kilos?)$/.test(k) ? {n:tot, u:"kg"} : /^(ml|cc)$/.test(k) ? {n:tot, u:"ml"} : {n:tot, u:"g"}; }
  const m = t.match(/(\d+(?:\.\d+)?)\s*([a-z]*)/);
  if(!m) return null;
  const n = parseFloat(m[1]), w = m[2] || "";
  let u = "";
  if(/^(l|lt|lts|litro|litros)$/.test(w)) u = "l";
  else if(/^(ml|cc)$/.test(w)) u = "ml";
  else if(/^(kg|kilo|kilos|kgs)$/.test(w)) u = "kg";
  else if(/^(g|gr|grs|gramos)$/.test(w)) u = "g";
  else if(/^(lata|latas)$/.test(w)) u = "lata";
  else if(/^(paquete|paquetes|paq|caja|cajas|bolsa|bolsas|sobre|sobres)$/.test(w)) u = "paq";
  else if(/^(dia|dias)$/.test(w)) u = "dia";
  else if(/^(semana|semanas)$/.test(w)) u = "sem";
  else if(/^(mes|meses)$/.test(w)) u = "mes";
  else if(/^(bidon|bidones)$/.test(w)){ const lit = t.slice(m.index + m[0].length).match(/(\d+(?:\.\d+)?)\s*(l|lt|lts|litros)\b/); return {n, u:"bidon", bid:lit ? parseFloat(lit[1]) : 0}; }
  else if(/^(botella|botellas)$/.test(w)) u = "botella";
  else if(/^(comprimido|comprimidos|pastilla|pastillas|unidad|unidades|u)$/.test(w) || !w) u = "u";
  return {n, u};
}
/* Calorías aproximadas por tipo de alimento */
const KCAL = [
  [/aceite/, {kg:8800, l:8000}],
  [/leche en polvo/, {kg:4900, paq:4900 * 0.8}],
  [/leche/, {l:600, paq:600}],
  [/azucar/, {kg:4000, paq:4000}],
  [/mani|frutos secos|nuez|nueces|almendra/, {kg:6000, paq:1500}],
  [/galletita|galleta|tostada|bizcocho/, {kg:4500, paq:1400}],
  [/dulce|miel|mermelada/, {kg:2800, paq:1400}],
  [/arroz|fideo|harina|polenta|avena|lenteja|poroto|garbanzo|arveja seca|legumbre|cereal|semola/, {kg:3500, paq:1750}],
  [/pure instantaneo|pure/, {kg:3500, paq:450}],
  [/atun|caballa|sardina|pescado/, {lata:200}],
  [/carne|picadillo|paté|pate|salchicha|corned/, {lata:350}],
  [/lenteja|poroto|garbanzo|legumbre|arveja|choclo/, {lata:250}],
  [/durazno|fruta|anana|pera|coctel/, {lata:280}],
  [/tomate|verdura|jardinera|chaucha/, {lata:90}],
  [/sopa|caldo/, {paq:90}],
  [/barra|barrita|cereal/, {u:150}],
  [/\b(yerba|te|cafe|sal)\b/, {skip:true}]
];
function kcalDe(it){
  const c = parseCant(it.cant || ""), n = norm(it.nombre);
  if(!c) return null;
  for(const [re, k] of KCAL){
    if(!re.test(n)) continue;
    if(k.skip) return 0;
    if(c.u === "kg" && k.kg) return c.n * k.kg;
    if(c.u === "g" && k.kg) return c.n / 1000 * k.kg;
    if((c.u === "l" || c.u === "botella") && k.l) return c.n * k.l;
    if(c.u === "lata" && k.lata) return c.n * k.lata;
    if(c.u === "lata" && k.kg) return c.n * 300;
    if(c.u === "paq" && k.paq) return c.n * k.paq;
    if(c.u === "u" && k.u) return c.n * k.u;
    if(c.u === "u" && k.lata) return c.n * k.lata;
  }
  if(c.u === "lata") return c.n * 200;
  if(c.u === "kg") return c.n * 2500;
  return null;
}
function autonomia(){
  const cfg = mesCfg(), P = cfg.p, G = cfg.g, out = {P, G};
  const inv = state.inv;
  // Agua: 4 litros por persona por día, más el gato
  let litros = 0, aguaNo = [];
  inv.filter(i => i.cat === "Agua").forEach(i => { const c = parseCant(i.cant || ""); if(!c) return aguaNo.push(i.nombre);
    if(c.u === "l") litros += c.n; else if(c.u === "ml") litros += c.n / 1000; else if(c.u === "bidon" && c.bid) litros += c.n * c.bid; else if(c.u === "botella") litros += c.n * 2; else aguaNo.push(i.nombre); });
  out.agua = {litros:Math.round(litros), dias:litros ? Math.floor(litros / (P * 4 + G * 0.25)) : 0, no:aguaNo, hay:inv.some(i => i.cat === "Agua")};
  // Comida
  let kcal = 0; const comNo = [], comidas = inv.filter(i => i.cat === "Comida" && !/gato|perro|mascota/.test(norm(i.nombre)));
  comidas.forEach(i => { const k = kcalDe(i); if(k === null) comNo.push(i.nombre); else kcal += k; });
  out.comida = {kcal, dias:Math.floor(kcal / (P * 2000)), no:comNo, total:comidas.length};
  // Remedios: cada uno anotado en días, semanas o meses
  const rem = inv.filter(i => i.cat === "Remedios" && !/botiquin/.test(norm(i.nombre))).map(i => { const c = parseCant(i.cant || ""); const d = !c ? null : c.u === "dia" ? c.n : c.u === "sem" ? c.n * 7 : c.u === "mes" ? c.n * 30 : null; return {n:i.nombre, d}; });
  const remOk = rem.filter(r => r.d !== null);
  out.remedios = {dias:remOk.length ? Math.min(...remOk.map(r => r.d)) : null, cual:remOk.length ? remOk.reduce((a, b) => a.d <= b.d ? a : b).n : "", no:rem.filter(r => r.d === null).map(r => r.n), total:rem.length};
  // Gato: unos 60 g de alimento seco por día
  if(G){
    let kg = 0, no = [];
    inv.filter(i => /gato|mascota/.test(norm(i.nombre))).forEach(i => { const c = parseCant(i.cant || ""); if(c && c.u === "kg") kg += c.n; else if(c && c.u === "g") kg += c.n / 1000; else no.push(i.nombre); });
    out.gato = {kg, dias:Math.floor(kg / (0.06 * G)), no};
  }
  const lst = [["Agua", out.agua.dias, out.agua.hay], ["Comida", out.comida.dias, out.comida.total > 0], ["Remedios", out.remedios.dias, out.remedios.total > 0 && out.remedios.dias !== null]].concat(G ? [["Comida del gato", out.gato.dias, true]] : []);
  const cuenta = lst.filter(x => x[2]);
  out.min = cuenta.length ? cuenta.reduce((a, b) => a[1] <= b[1] ? a : b) : null;
  return out;
}
const diasTxt = d => d === null || d === undefined ? "—" : d >= 60 ? "60+" : String(d);
function autonomiaHTML(compact){
  const a = autonomia();

/* ---------- Linterna con el flash del celular ---------- */
let torchTrack = null, torchSosT = null;
async function torchGet(){
  if(torchTrack) return torchTrack;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return null;
  try{
    const s = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});
    const t = s.getVideoTracks()[0];
    const caps = t && t.getCapabilities ? t.getCapabilities() : {};
    if(!caps.torch){ s.getTracks().forEach(x => x.stop()); return null; }
    torchTrack = t;
    return t;
  }catch(e){ return null; }
}
async function torchSet(on){ try{ if(torchTrack) await torchTrack.applyConstraints({advanced:[{torch:on}]}); return true; }catch(e){ return false; } }
function torchOff(){
  clearTimeout(torchSosT); torchSosT = null;
  if(torchTrack){ try{ torchTrack.applyConstraints({advanced:[{torch:false}]}); }catch(e){} try{ torchTrack.stop(); }catch(e){} torchTrack = null; }
  ui.torchOn = false;
}
async function torchToggle(){
  if(ui.torchOn){ torchOff(); afterTool(); return; }
  const t = await torchGet();
  if(t && await torchSet(true)){ ui.torchOn = true; ui.torchNo = false; afterTool(); return; }
  torchOff(); ui.torchNo = true;
  if(ui.tab === "linterna") render(false);
  openOverlay("linterna");
}
async function torchSos(){
  const t = await torchGet();
  if(!t) return;
  let k = 0;
  const step = async () => { await torchSet(k % 2 === 0); torchSosT = setTimeout(() => { k = (k + 1) % SOS.length; step(); }, SOS[k] * UNIT); };
  step();
}

/* ---------- Llevarme a un lugar: navegación a pie, sin internet ---------- */
const NAV = {watch:null, fix:null, prev:null, course:null, compass:null, compassAt:0, route:null, routeAt:0, dest:null, arrived:false, orient:false, raf:0};
function navDestinos(){
  const pri = l => /casa/i.test(l.nombre) ? 0 : /famili|tia|tío|tio|abuel|herman/i.test(l.nombre) ? 1 : /encuentro/i.test(l.nombre) ? 2 : 3;
  return state.lugares.slice().sort((a, b) => pri(a) - pri(b));
}
function navOrient(){
  if(NAV.orient) return;
  NAV.orient = true;
  const onO = e => {
    let h = null;
    if(typeof e.webkitCompassHeading === "number") h = e.webkitCompassHeading;
    else if((e.absolute || e.type === "deviceorientationabsolute") && typeof e.alpha === "number") h = (360 - e.alpha) % 360;
    if(h === null) return;
    const ang = (screen.orientation && typeof screen.orientation.angle === "number") ? screen.orientation.angle : (window.orientation || 0);
    h = (h + ang + 360) % 360;
    // suavizado
    if(NAV.compass === null) NAV.compass = h;
    else { const d = ((h - NAV.compass + 540) % 360) - 180; NAV.compass = (NAV.compass + d * 0.25 + 360) % 360; }
    NAV.compassAt = Date.now();
    if(!NAV.raf) NAV.raf = requestAnimationFrame(() => { NAV.raf = 0; if(ui.sub === "ir") navArrow(); else if(ui.sub === "mapa") drawCompass(); });
  };
  window.addEventListener("deviceorientationabsolute", onO);
  window.addEventListener("deviceorientation", onO);
}
function navHeading(){
  if(NAV.compass !== null && Date.now() - NAV.compassAt < 3000) return {h:NAV.compass, src:"compass"};
  if(NAV.course !== null) return {h:NAV.course, src:"course"};
  return {h:null, src:"none"};
}
function goNav(id){
  const l = state.lugares.find(x => x.id === id);
  if(!l) return;
  NAV.dest = l; NAV.route = null; NAV.arrived = false; NAV.course = null;
  if(!NAV.fix && state.ultimaPos && Date.now() - (state.ultimaPos.at || 0) < 10 * 60000) NAV.fix = Object.assign({}, state.ultimaPos, {old:true});
  go("inicio", {sub:"ir"});
  navStart();
}
function navStart(){
  navOrient(); keepAwake();
  if(NAV.watch !== null || !navigator.geolocation) return;
  try{
    NAV.watch = navigator.geolocation.watchPosition(p => {
      const f = {lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy || 0, at:Date.now()};
      // si llega una lectura mucho peor que la anterior y reciente, se descarta
      if(NAV.fix && !NAV.fix.old && f.acc > 120 && NAV.fix.acc < f.acc / 2 && Date.now() - NAV.fix.at < 20000) return;
      if(NAV.fix && !NAV.fix.old){
        const d = distKm(NAV.fix, f) * 1000;
        if(d > Math.max(6, f.acc * 0.5)){ NAV.course = rumbo(NAV.fix, f); }
      }
      NAV.prev = NAV.fix; NAV.fix = f;
      state.ultimaPos = f; save();
      navUpdate();
    }, e => { NAV.err = e && e.code === 1 ? "perm" : "nofix"; navUpdate(); }, {enableHighAccuracy:true, maximumAge:0, timeout:20000});
  }catch(e){ NAV.err = "nofix"; }
}
function navStop(){
  if(NAV.watch !== null){ try{ navigator.geolocation.clearWatch(NAV.watch); }catch(e){} NAV.watch = null; }
  if(!metro && !ui.torchOn) releaseAwake();
}
/* Geometría sobre la ruta (coordenadas del plano de Azul) */
const segM = (a, b) => Math.hypot((b[0] - a[0]) * KX, (b[1] - a[1]) * KY);
const brg = (a, b) => (Math.atan2((b[0] - a[0]) * KX, (b[1] - a[1]) * KY) * 180 / Math.PI + 360) % 360;
function navProject(pts, p){
  let best = {i:0, t:0, d:1e18};
  for(let i = 1; i < pts.length; i++){
    const a = pts[i - 1], b = pts[i], dx = (b[0] - a[0]) * KX, dy = (b[1] - a[1]) * KY, L = dx * dx + dy * dy;
    let t = L ? (((p[0] - a[0]) * KX) * dx + ((p[1] - a[1]) * KY) * dy) / L : 0; t = Math.max(0, Math.min(1, t));
    const qx = (a[0] - p[0]) * KX + t * dx, qy = (a[1] - p[1]) * KY + t * dy, d = Math.hypot(qx, qy);
    if(d < best.d) best = {i, t, d};
  }
  const a = pts[best.i - 1], b = pts[best.i];
  best.pt = [a[0] + (b[0] - a[0]) * best.t, a[1] + (b[1] - a[1]) * best.t];
  return best;
}
function navAhead(pts, pr, metros){
  let rest = metros, cur = pr.pt;
  for(let i = pr.i; i < pts.length; i++){
    const L = segM(cur, pts[i]);
    if(L >= rest){ const t = rest / L; return [cur[0] + (pts[i][0] - cur[0]) * t, cur[1] + (pts[i][1] - cur[1]) * t]; }
    rest -= L; cur = pts[i];
  }
  return pts[pts.length - 1];
}
function navInfo(){
  const f = NAV.fix, d = NAV.dest;
  if(!f || !d) return null;
  const directo = {km:distKm(f, d), brg:rumbo(f, d)};
  if(!enAzul(f) || !enAzul(d)) return Object.assign(directo, {modo:"directo"});
  const p = toXY(f), q = toXY(d);
  // nueva ruta si no hay, si te alejaste o cada 30 segundos
  let pr = NAV.route ? navProject(NAV.route.pts, p) : null;
  if(!NAV.route || (pr && pr.d > 40 + Math.min(60, f.acc / 2)) || Date.now() - NAV.routeAt > 30000){
    const r = ruta(p, q);
    NAV.routeAt = Date.now();
    if(r){
      // sacar el ida y vuelta del principio y del final: si estás en medio de una cuadra, se sigue derecho
      const pts = r.pts.slice(), proj = (a, b, c) => { const dx = (b[0] - a[0]) * KX, dy = (b[1] - a[1]) * KY, L = dx * dx + dy * dy; return L ? (((c[0] - a[0]) * KX) * dx + ((c[1] - a[1]) * KY) * dy) / L : -1; };
      if(pts.length > 3){ const t = proj(pts[1], pts[2], pts[0]); if(t > 0 && t < 1) pts.splice(1, 1); }
      if(pts.length > 3){ const n = pts.length, t = proj(pts[n - 2], pts[n - 3], pts[n - 1]); if(t > 0 && t < 1) pts.splice(n - 2, 1); }
      NAV.route = {pts, m:r.m}; pr = navProject(pts, p);
    }
  }
  if(!NAV.route || !pr) return Object.assign(directo, {modo:"directo"});
  const pts = NAV.route.pts;
  // distancia que falta por las calles
  let falta = segM(pr.pt, pts[pr.i]);
  for(let i = pr.i + 1; i < pts.length; i++) falta += segM(pts[i - 1], pts[i]);
  const ahead = navAhead(pts, pr, 30);
  // próxima vuelta
  let acc = segM(pr.pt, pts[pr.i]), giro = null;
  const calle0 = calleCerca(pr.pt[0], pr.pt[1]);
  for(let i = pr.i; i < pts.length - 2; i++){
    const bin = brg(i === pr.i ? pr.pt : pts[i - 1], pts[i]), bout = brg(pts[i], pts[i + 1]);
    const delta = ((bout - bin + 540) % 360) - 180;
    if(Math.abs(delta) > 35 && segM(pts[i], pts[i + 1]) > 12){
      const after = navAhead(pts, {i:i + 1, pt:pts[i]}, 20), nueva = calleCerca(after[0], after[1]);
      if(!(nueva && calle0 && nueva === calle0) && acc > 8){
        giro = {m:acc, dir:delta > 0 ? "derecha" : "izquierda", calle:nueva, fuerte:Math.abs(delta) > 160};
        break;
      }
    }
    acc += segM(pts[i], pts[i + 1]);
  }
  const calle = calle0;
  const aheadLL = toLL(ahead[0], ahead[1]);
  return {modo:"calles", km:falta / 1000, brg:rumbo(f, aheadLL), giro, calle, directo};
}
function navArrowRot(info){
  const h = navHeading();
  return h.h === null ? info.brg : (info.brg - h.h + 360) % 360;
}
function navArrow(){
  const g = document.getElementById("nav-arrow");
  if(!NAV.info) return;
  if(!g || !NAV.info) return;
  g.setAttribute("transform", `rotate(${navArrowRot(NAV.info).toFixed(0)})`);
  const s = document.getElementById("nav-src"); if(s) s.textContent = navSrcTxt();

function navSrcTxt(){

    : "Camina unos pasos para que la flecha se oriente. Mientras tanto, el norte está arriba.";
}
function navUpdate(){
  if(ui.sub !== "ir") return;
  NAV.info = navInfo();
  const m = ui.mapa;
  if(NAV.fix){ m.yo = {lat:NAV.fix.lat, lng:NAV.fix.lng, acc:NAV.fix.acc, gps:true}; }
  if(NAV.dest && enAzul(NAV.dest)){ const [x, y] = toXY(NAV.dest); m.sel = {tipo:"Mi lugar", n:NAV.dest.nombre, x, y, lid:NAV.dest.id}; }
  m.ruta = NAV.route; m.calle = null;
  if(NAV.info && NAV.info.km < 0.025 && !NAV.arrived){ NAV.arrived = true; try{ navigator.vibrate && navigator.vibrate([200, 100, 200]); }catch(e){} }
  const box = document.getElementById("nav-box"); if(box) box.innerHTML = navBoxHTML();
  if(NAV.fix && enAzul(NAV.fix)){ const [x, y] = toXY(NAV.fix); MAP.cx = x; MAP.cy = y; if(MAP.z < 0.7) MAP.z = 0.85; }
  drawMapa(); navArrow();
}
function accTxt(a){ return a <= 15 ? ["buena", "ok"] : a <= 40 ? ["aceptable", "mid"] : ["baja: sal al aire libre y espera", "bad"]; }

  }
  if(NAV.arrived) return `<div class="nav-ok"><p class="nav-big">Llegaste a ${esc(d.nombre)}</p><button class="btn btn-primary" data-action="nav-stop">Terminar</button></div>`;
  const [at, ac] = accTxt(f.acc);

  if(info.modo === "calles"){
    instr = info.giro && info.giro.m < info.km * 1000 - 15
      ? `${info.calle ? `Sigue por <strong>${esc(info.calle)}</strong>. ` : ""}En <strong>${fmtKm(info.giro.m / 1000)}</strong>, ${info.giro.fuerte ? "date vuelta" : `dobla a la <strong>${info.giro.dir}</strong>`}${info.giro.calle && !info.giro.fuerte ? ` por <strong>${esc(info.giro.calle)}</strong>` : ""}.`
      : `${info.calle ? `Sigue por <strong>${esc(info.calle)}</strong>: ` : ""}llegas en ${fmtKm(info.km)}.`;
  }else instr = `En línea recta, hacia ${cardinal(info.brg)}. Fuera del plano de Azul no hay calles: usa la app de mapas si tienes una descargada.`;
  return `<div class="nav-main">
      <svg viewBox="-60 -60 120 120" class="nav-dial" aria-hidden="true"><circle r="56" class="ring"/><g id="nav-arrow" transform="rotate(${navArrowRot(info).toFixed(0)})"><path class="needle" d="M0 -48l20 44-20-12-20 12z"/></g></svg>
      <div class="nav-txt"><p class="nav-big">${fmtKm(info.km)}</p><p>unas ${cuadras === 1 ? "1 cuadra" : `${cuadras} cuadras`} · ${min} min a pie</p></div>

function renderLlevar(){

/* Distancia por las calles desde donde estás hasta cada lugar guardado */
const DIST_CACHE = new Map();
function distLugar(pos, l){
  const key = `${pos.lat.toFixed(4)},${pos.lng.toFixed(4)}|${l.id}|${l.lat},${l.lng}`;
  if(DIST_CACHE.has(key)) return DIST_CACHE.get(key);
  let m = distKm(pos, l) * 1000, calles = false;
  if(enAzul(pos) && enAzul(l)){ try{ const r = ruta(toXY(pos), toXY(l)); if(r){ m = r.m; calles = true; } }catch(e){} }
  const out = {m, calles, brg:rumbo(pos, l)};
  DIST_CACHE.set(key, out);
  return out;
}
const cuadrasTxt = m => { const c = Math.max(1, Math.round(m / 110)); return c === 1 ? "1 cuadra" : `${c} cuadras`; };
let posPedida = 0;
function pedirPos(){
  if(!navigator.geolocation || Date.now() - posPedida < 60000) return;
  posPedida = Date.now();
  try{
    navigator.geolocation.getCurrentPosition(p => {
      state.ultimaPos = {lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy || 0, at:Date.now()}; save();
      if(ui.tab === "inicio" && ui.sub === "llevar"){ const y = window.scrollY; render(false); window.scrollTo(0, y); }
      else document.querySelectorAll("[data-navrow]").forEach(el => { el.outerHTML = navRow(); });
    }, () => { document.querySelectorAll("[data-navrow] .nr-pos").forEach(el => { el.textContent = "No pude ubicarte: sal al aire libre o activa la ubicación."; }); }, {enableHighAccuracy:true, timeout:20000, maximumAge:60000});
  }catch(e){}
}
function navRow(max){
  const ds = navDestinos().slice(0, max || 5);
  if(!ds.length) return `<button class="nav-row empty" data-action="dir-abrir">${icon("compass")}<span><strong>Llevarme a casa</strong><span>Primero agrega la dirección de tu casa y la de un familiar</span></span>${icon("chev")}</button>`;
  const pos = state.ultimaPos, edad = pos ? Date.now() - (pos.at || 0) : Infinity;
  if(edad > 2 * 60000) setTimeout(pedirPos, 0);
  const posTxt = !pos ? "Buscando dónde estás…" : edad < 2 * 60000 ? `Desde donde estás${pos.acc ? ` (±${Math.round(pos.acc)} m)` : ""}` : `Desde donde estabas hace ${fmtDur(edad)} · actualizando…`;
  const rows = ds.map(l => {
    const d = pos ? distLugar(pos, l) : null;
    const det = !d ? "" : d.m < 30 ? "Estás acá" : `${fmtKm(d.m / 1000)} · ${cuadrasTxt(d.m)}${d.calles ? "" : " en línea recta"} · hacia ${cardinal(d.brg)}`;
    return `<li><button class="nr-item" data-action="nav-go" data-id="${esc(l.id)}"><span class="nr-t"><strong>${esc(l.nombre)}</strong>${det ? `<span>${det}</span>` : ""}</span><span class="nr-go">${icon("compass")}Ir</span></button></li>`;
  }).join("");
  return `<div class="nav-row" data-navrow><div class="nr-head"><span class="nav-row-t">${icon("compass")}Llevarme a</span><span class="inline"><button class="btn btn-ghost btn-sm" data-action="go-lugares">Editar</button><button class="btn btn-ghost btn-sm" data-action="dir-abrir" aria-label="Agregar una dirección">+ Agregar</button></span></div>
    <p class="nr-pos fine">${posTxt}</p><ul class="nr-list">${rows}</ul></div>`;
}
